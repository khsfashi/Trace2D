name: Agent Apply U8 Patch V2

on:
  push:
    branches:
      - agent/e6-u8-ui-clipping

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply U8 patch with recounted hunks
        shell: bash
        run: |
          if ! git apply --check --recount .agent/u8.patch; then
            echo "Patch is not applicable; leaving branch unchanged."
            exit 0
          fi
          git apply --recount .agent/u8.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ui engine/agent tests/ui docs/UI_E6_U8.md
          git commit -m "E6 U8: add deterministic hierarchical clipping"
          git push origin "HEAD:${GITHUB_REF_NAME}"
