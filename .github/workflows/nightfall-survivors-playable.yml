name: Nightfall Survivors Playable

on:
  pull_request:
    branches:
      - main
    paths:
      - "examples/g1_nightfall_survivors/**"
      - ".github/workflows/nightfall-survivors-playable.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRACE2D_VCPKG_BASELINE: d92484ed3c5020c6679d095ad3e5add907887b62

jobs:
  windows-playable:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgDownloads = Join-Path $env:GITHUB_WORKSPACE ".trace2d-vcpkg-downloads"
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          git -C $vcpkgRoot checkout $env:TRACE2D_VCPKG_BASELINE
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $vcpkgDownloads | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=$vcpkgDownloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg source downloads
        uses: actions/cache/restore@v4
        with:
          path: .trace2d-vcpkg-downloads
          key: trace2d-vcpkg-downloads-v5-${{ env.TRACE2D_VCPKG_BASELINE }}
          enableCrossOsArchive: true

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build playable Release target and fetch CC0 assets
        run: cmake --build --preset windows-release --target trace2d_g1_nightfall_survivors_windowed --parallel

      - name: Stage portable playable package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build/windows-msvc" -Recurse -File -Filter "trace2d_g1_nightfall_survivors_windowed.exe" | Select-Object -First 1
          if (-not $exe) { throw "Nightfall Survivors executable was not produced." }
          $runtime = Join-Path $exe.Directory.FullName "runtime"
          if (-not (Test-Path $runtime)) { throw "Nightfall Survivors packaged runtime directory is missing." }

          $package = Join-Path $env:RUNNER_TEMP "nightfall-survivors-windows"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $exe.FullName (Join-Path $package $exe.Name)
          Copy-Item $runtime (Join-Path $package "runtime") -Recurse

          $requiredDlls = @(
            "SDL3.dll",
            "SDL3_shadercross.dll",
            "freetype.dll",
            "tomlplusplus-3.dll",
            "dxcompiler.dll",
            "dxil.dll",
            "box2d.dll"
          )
          foreach ($dllName in $requiredDlls) {
            $candidate = Get-ChildItem -Path @(
              $exe.Directory.FullName,
              "build/windows-msvc/vcpkg_installed/x64-windows/bin"
            ) -Recurse -File -Filter $dllName -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) {
              Copy-Item $candidate.FullName (Join-Path $package $dllName) -Force
            }
          }

          Copy-Item "examples/g1_nightfall_survivors/README.md" (Join-Path $package "README.md")
          Copy-Item "examples/g1_nightfall_survivors/CREDITS.md" (Join-Path $package "CREDITS.md")

          $forbiddenScripts = Get-ChildItem -Path $package -Recurse -File | Where-Object {
            $_.Extension -in @(".bat", ".cmd", ".ps1", ".vbs", ".js")
          }
          if ($forbiddenScripts) {
            throw "Nightfall package unexpectedly contains script files: $($forbiddenScripts.FullName -join ', ')"
          }

          $hashLines = Get-ChildItem -Path $package -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($package, $_.FullName).Replace('\\', '/')
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $hashLines | Set-Content -Path (Join-Path $package "SHA256SUMS.txt") -Encoding ascii

          "TRACE2D_NIGHTFALL_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Microsoft Defender artifact gate
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "nightfall-defender-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          "TRACE2D_NIGHTFALL_DEFENDER_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $statusCommand = Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue
          if (-not $statusCommand) {
            "available=false`nreason=Get-MpComputerStatus unavailable" | Set-Content (Join-Path $evidence "status.txt") -Encoding utf8
            Write-Host "Microsoft Defender PowerShell surface is unavailable on this runner; recording skip evidence."
            exit 0
          }

          $status = Get-MpComputerStatus
          $status | Format-List * | Out-File (Join-Path $evidence "computer-status.txt") -Encoding utf8
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            "available=false`nreason=Defender service or antivirus disabled" | Set-Content (Join-Path $evidence "status.txt") -Encoding utf8
            Write-Host "Microsoft Defender is installed but disabled on this runner; recording skip evidence."
            exit 0
          }

          "available=true" | Set-Content (Join-Path $evidence "status.txt") -Encoding utf8
          try {
            Update-MpSignature 2>&1 | Tee-Object -FilePath (Join-Path $evidence "signature-update.txt")
          } catch {
            $_ | Out-String | Set-Content (Join-Path $evidence "signature-update-error.txt") -Encoding utf8
          }

          $before = @(Get-MpThreatDetection -ErrorAction SilentlyContinue)
          Start-MpScan -ScanType CustomScan -ScanPath $env:TRACE2D_NIGHTFALL_PACKAGE
          $after = @(Get-MpThreatDetection -ErrorAction SilentlyContinue)
          $packagePath = [System.IO.Path]::GetFullPath($env:TRACE2D_NIGHTFALL_PACKAGE)
          $detections = @($after | Where-Object {
            ($_.Resources | Where-Object { $_ -like "*$packagePath*" }).Count -gt 0
          })
          $detections | Format-List * | Out-File (Join-Path $evidence "detections.txt") -Encoding utf8
          "before=$($before.Count)`nafter=$($after.Count)`npackageDetections=$($detections.Count)" |
            Set-Content (Join-Path $evidence "scan-summary.txt") -Encoding utf8
          if ($detections.Count -gt 0) {
            throw "Microsoft Defender detected the staged Nightfall package. Artifact upload is blocked; inspect defender evidence."
          }

      - name: Upload Defender evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-survivors-defender-evidence
          path: ${{ env.TRACE2D_NIGHTFALL_DEFENDER_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows playable
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-survivors-windows
          path: ${{ env.TRACE2D_NIGHTFALL_PACKAGE }}
          if-no-files-found: error
          retention-days: 14
