name: Nightfall Layout Hotfix

on:
  push:
    branches: [game/nightfall-survivors]
    paths:
      - .github/workflows/nightfall-layout-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: game/nightfall-survivors
      - name: Apply exact layout patches
        shell: python
        run: |
          from pathlib import Path

          presentation = Path('examples/g1_nightfall_survivors/NightfallPresentationMeasured.cpp')
          contract = Path('examples/g1_nightfall_survivors/NightfallLayoutContractMain.cpp')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(presentation,
              'const Rect detailPanel = AddPanel(0.0F, -2.63F, 13.65F, 0.72F, Panel, 0.98F, 42);',
              'const Rect detailPanel = AddPanel(0.0F, -2.75F, 13.65F, 0.72F, Panel, 0.98F, 42);')
          replace_once(presentation,
              '0.0F, -2.39F, MicroPpu, selectedUnlocked ? Muted : Dim, true, 74);',
              '0.0F, -2.51F, MicroPpu, selectedUnlocked ? Muted : Dim, true, 74);')
          replace_once(presentation,
              'const Rect detailPanel = AddPanel(0.0F, -2.60F, 13.65F, 0.68F, Panel, 0.98F, 42);',
              'const Rect detailPanel = AddPanel(0.0F, -2.72F, 13.65F, 0.68F, Panel, 0.98F, 42);')
          replace_once(presentation,
              '0.0F, -2.38F, MicroPpu, selectedUnlocked ? Muted : Dim, true, 74);',
              '0.0F, -2.50F, MicroPpu, selectedUnlocked ? Muted : Dim, true, 74);')
          replace_once(presentation,
              'RequireInside("stage.detail", detail, "stage.detailPanel", detailPanel, 0.09F);\n        const auto selectedCharacter',
              'RequireInside("stage.detail", detail, "stage.detailPanel", detailPanel, 0.09F);\n        RequireDisjoint("stage.cards", UnionRect(cards[0], cards[2]), "stage.detailPanel", detailPanel, 0.12F);\n        const auto selectedCharacter')

          replace_once(contract,
              'return stream.str();\n}\n\nvoid RequireInside',
              'return stream.str();\n}\n\n[[nodiscard]] std::vector<std::string>& LayoutViolations()\n{\n    static std::vector<std::string> violations{};\n    return violations;\n}\n\nvoid RequireInside')
          replace_once(contract,
              'throw std::runtime_error{\n        "Nightfall headless layout violation [" + std::string{scenario} + "]: " +\n        std::string{childId} + " escapes " + std::string{parentId} +\n        " child=" + RectString(child) + " parent=" + RectString(parent)};',
              'LayoutViolations().push_back(\n        "Nightfall headless layout violation [" + std::string{scenario} + "]: " +\n        std::string{childId} + " escapes " + std::string{parentId} +\n        " child=" + RectString(child) + " parent=" + RectString(parent));')
          replace_once(contract,
              'throw std::runtime_error{\n        "Nightfall headless layout violation [" + std::string{scenario} + "]: " +\n        std::string{leftId} + " intersects " + std::string{rightId} +\n        " first=" + RectString(left) + " second=" + RectString(right)};',
              'LayoutViolations().push_back(\n        "Nightfall headless layout violation [" + std::string{scenario} + "]: " +\n        std::string{leftId} + " intersects " + std::string{rightId} +\n        " first=" + RectString(left) + " second=" + RectString(right));')
          replace_once(contract,
              'void Run()\n    {\n        constexpr std::array<std::pair<std::uint32_t, std::uint32_t>, 3U> Viewports',
              'void Run()\n    {\n        LayoutViolations().clear();\n        constexpr std::array<std::pair<std::uint32_t, std::uint32_t>, 3U> Viewports')
          replace_once(contract,
              '        }\n    }\n\n    [[nodiscard]] std::size_t ScenarioCount() const noexcept',
              '        }\n        if (!LayoutViolations().empty())\n        {\n            std::ostringstream stream{};\n            stream << "Nightfall headless layout sweep found " << LayoutViolations().size() << " violation(s):";\n            for (const auto& violation : LayoutViolations()) stream << "\\n" << violation;\n            throw std::runtime_error{stream.str()};\n        }\n    }\n\n    [[nodiscard]] std::size_t ScenarioCount() const noexcept')
          replace_once(contract,
              'const Rect detailPanel = PanelRect(0.0F, -2.63F, 13.65F, 0.72F);',
              'const Rect detailPanel = PanelRect(0.0F, -2.75F, 13.65F, 0.72F);')
          replace_once(contract,
              '0.0F, -2.39F, MicroPpu, true);',
              '0.0F, -2.51F, MicroPpu, true);')
          replace_once(contract,
              'const Rect detailPanel = PanelRect(0.0F, -2.60F, 13.65F, 0.68F);',
              'const Rect detailPanel = PanelRect(0.0F, -2.72F, 13.65F, 0.68F);')
          replace_once(contract,
              '0.0F, -2.38F, MicroPpu, true);',
              '0.0F, -2.50F, MicroPpu, true);')
          replace_once(contract,
              'RequireInside(scenario, "stage.detail", detail, "stage.detailPanel", detailPanel, 0.09F);\n            const Rect equipped',
              'RequireInside(scenario, "stage.detail", detail, "stage.detailPanel", detailPanel, 0.09F);\n            RequireDisjoint(scenario, "stage.cards", UnionRect(cards[0], cards[2]), "stage.detailPanel", detailPanel, 0.12F);\n            const Rect equipped')
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nightfall-layout-hotfix.yml
          git add examples/g1_nightfall_survivors/NightfallPresentationMeasured.cpp examples/g1_nightfall_survivors/NightfallLayoutContractMain.cpp
          git commit -m "fix: batch Nightfall measured layout validation"
          git push origin HEAD:game/nightfall-survivors
