name: E9 Branch Patch Helper

on:
  push:
    branches:
      - agent/e9-linux-clang-baseline

permissions:
  contents: write

jobs:
  patch-exact-sources:
    if: github.repository == 'khsfashi/Trace2D' && github.ref == 'refs/heads/agent/e9-linux-clang-baseline'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: agent/e9-linux-clang-baseline
          fetch-depth: 0

      - name: Apply fail-closed source fixes
        shell: python
        run: |
          import re
          from pathlib import Path

          tile_path = Path('engine/tile/src/TileMap.cpp')
          tile = tile_path.read_text(encoding='utf-8')
          tile_pattern = re.compile(
              r'\nstd::optional<std::uint32_t> ReadRequiredUInt32\(\n'
              r'.*?'
              r'\n\}\n\nbool ReadInt32Pair\(',
              re.DOTALL,
          )
          tile, tile_count = tile_pattern.subn('\nbool ReadInt32Pair(', tile, count=1)
          if tile_count != 1:
              raise SystemExit(f'TileMap.cpp dead-helper match count was {tile_count}, expected 1')
          tile_path.write_text(tile, encoding='utf-8')

          mcp_path = Path('engine/mcp/src/McpServer.cpp')
          mcp = mcp_path.read_text(encoding='utf-8')
          mcp_pattern = re.compile(
              r'    case agent::FieldValueKind::String:\n'
              r'        result\["value"\] = value\.stringValue;\n'
              r'        break;\n'
              r'    \}\n'
              r'    return result;\n'
              r'\}',
          )
          replacement = (
              '    case agent::FieldValueKind::String:\n'
              '        result["value"] = value.stringValue;\n'
              '        break;\n'
              '    case agent::FieldValueKind::Float2:\n'
              '        result["value"] = Json::array({value.vectorValue[0], value.vectorValue[1]});\n'
              '        break;\n'
              '    case agent::FieldValueKind::Float4:\n'
              '        result["value"] = Json::array({\n'
              '            value.vectorValue[0],\n'
              '            value.vectorValue[1],\n'
              '            value.vectorValue[2],\n'
              '            value.vectorValue[3],\n'
              '        });\n'
              '        break;\n'
              '    case agent::FieldValueKind::EntityReference:\n'
              '    case agent::FieldValueKind::ResourceReference:\n'
              '    case agent::FieldValueKind::EnumName:\n'
              '        result["value"] = value.stringValue;\n'
              '        break;\n'
              '    }\n'
              '    return result;\n'
              '}'
          )
          mcp, mcp_count = mcp_pattern.subn(replacement, mcp, count=1)
          if mcp_count != 1:
              raise SystemExit(f'McpServer.cpp switch-tail match count was {mcp_count}, expected 1')
          mcp_path.write_text(mcp, encoding='utf-8')

      - name: Commit exact source fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- engine/tile/src/TileMap.cpp engine/mcp/src/McpServer.cpp
          test -n "$(git status --porcelain -- engine/tile/src/TileMap.cpp engine/mcp/src/McpServer.cpp)"
          git config user.name "trace2d-ci"
          git config user.email "trace2d-ci@users.noreply.github.com"
          git add engine/tile/src/TileMap.cpp engine/mcp/src/McpServer.cpp
          git commit -m "E9.1: fix Clang portability findings"
          git push origin HEAD:agent/e9-linux-clang-baseline
