name: GPU Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: trace2d-owner-gpu-${{ github.ref }}
  cancel-in-progress: true

env:
  TRACE2D_VCPKG_BASELINE: d92484ed3c5020c6679d095ad3e5add907887b62

jobs:
  # Cache publication stays on trusted push workflows. Pull-request workflows are restore-only
  # because caches written by pull_request runs are isolated under refs/pull/*/merge.
  probe-vcpkg-source-cache:
    if: github.repository == 'khsfashi/Trace2D'
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      cache-hit: ${{ steps.lookup.outputs.cache-hit }}

    steps:
      - name: Publish pending owner GPU commit status
        uses: actions/github-script@v8
        with:
          script: |
            const targetUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'trace2d/owner-gpu-gate',
              description: 'Owner real-GPU gate is queued or running.',
              target_url: targetUrl,
            });

      - name: Probe baseline vcpkg source cache
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: .trace2d-vcpkg-downloads
          key: trace2d-vcpkg-downloads-v5-${{ env.TRACE2D_VCPKG_BASELINE }}
          lookup-only: true
          enableCrossOsArchive: true

  owner-windows-gpu:
    if: github.repository == 'khsfashi/Trace2D'
    needs: probe-vcpkg-source-cache
    runs-on: [self-hosted, windows, x64, trace2d-gpu]
    timeout-minutes: 45

    steps:
      - name: Checkout trusted repository push
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $toolRoot = $env:RUNNER_TOOL_CACHE
          if ([string]::IsNullOrWhiteSpace($toolRoot)) {
            $toolRoot = Join-Path $env:RUNNER_TEMP 'trace2d-tool-cache'
          }
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null

          $vcpkgRoot = Join-Path $toolRoot "trace2d-vcpkg-$env:TRACE2D_VCPKG_BASELINE"
          if (-not (Test-Path (Join-Path $vcpkgRoot '.git') -PathType Container)) {
            git clone https://github.com/microsoft/vcpkg $vcpkgRoot
            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg clone failed with exit code $LASTEXITCODE."
            }
          }

          git -C $vcpkgRoot fetch origin $env:TRACE2D_VCPKG_BASELINE --depth 1
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline fetch failed with exit code $LASTEXITCODE."
          }
          git -C $vcpkgRoot checkout --force $env:TRACE2D_VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline checkout failed with exit code $LASTEXITCODE."
          }

          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path $vcpkgExe -PathType Leaf)) {
            & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg bootstrap failed with exit code $LASTEXITCODE."
            }
          }

          $persistentDownloads = Join-Path $vcpkgRoot 'downloads'
          New-Item -ItemType Directory -Force -Path $persistentDownloads | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=$persistentDownloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Seed portable vcpkg source downloads
        if: needs.probe-vcpkg-source-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $sharedDownloads = Join-Path $env:GITHUB_WORKSPACE '.trace2d-vcpkg-downloads'
          $persistentDownloads = $env:VCPKG_DOWNLOADS
          Remove-Item -LiteralPath $sharedDownloads -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sharedDownloads | Out-Null

          if (-not (Test-Path $persistentDownloads -PathType Container)) {
            throw "Persistent vcpkg downloads directory was not found: $persistentDownloads"
          }

          Get-ChildItem -LiteralPath $persistentDownloads -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $sharedDownloads -Recurse -Force
          }

          if (-not (Get-ChildItem -LiteralPath $sharedDownloads -Force | Select-Object -First 1)) {
            throw 'Portable vcpkg source-download seed is empty.'
          }

      - name: Upload portable vcpkg source seed
        if: needs.probe-vcpkg-source-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-source-seed-${{ github.sha }}
          path: .trace2d-vcpkg-downloads
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: true

      - name: Run all real-GPU smoke and conformance tests
        shell: pwsh
        run: ./scripts/gpu_gate.ps1 -OutputDirectory artifacts/gpu-gate

      - name: Build Sprite SR8 final evidence manifest
        shell: pwsh
        run: |
          ./scripts/sprite_renderer_final_gate.ps1 `
            -OutputDirectory artifacts/sprite-renderer-final-gate `
            -ExistingGpuEvidenceDirectory artifacts/gpu-gate

      - name: Upload GPU gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-gate-${{ github.sha }}
          path: |
            artifacts/gpu-gate
            artifacts/sprite-renderer-final-gate
          if-no-files-found: warn
          retention-days: 30

  publish-owner-gpu-final-status:
    if: always() && github.repository == 'khsfashi/Trace2D'
    needs: owner-windows-gpu
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish final owner GPU commit status
        uses: actions/github-script@v8
        env:
          OWNER_GPU_RESULT: ${{ needs.owner-windows-gpu.result }}
        with:
          script: |
            const result = process.env.OWNER_GPU_RESULT || 'unknown';
            const states = {
              success: 'success',
              failure: 'failure',
              cancelled: 'error',
              skipped: 'error',
            };
            const descriptions = {
              success: 'Owner real-GPU gate passed.',
              failure: 'Owner real-GPU gate failed.',
              cancelled: 'Owner real-GPU gate was cancelled.',
              skipped: 'Owner real-GPU gate was skipped.',
            };
            const targetUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: states[result] || 'error',
              context: 'trace2d/owner-gpu-gate',
              description: descriptions[result] || `Owner real-GPU gate ended with ${result}.`,
              target_url: targetUrl,
            });

  publish-vcpkg-source-cache:
    if: github.repository == 'khsfashi/Trace2D' && needs.probe-vcpkg-source-cache.outputs.cache-hit != 'true'
    needs:
      - probe-vcpkg-source-cache
      - owner-windows-gpu
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Download portable vcpkg source seed
        uses: actions/download-artifact@v4
        with:
          name: vcpkg-source-seed-${{ github.sha }}
          path: .trace2d-vcpkg-downloads

      - name: Publish baseline vcpkg source cache
        uses: actions/cache/save@v4
        with:
          path: .trace2d-vcpkg-downloads
          key: trace2d-vcpkg-downloads-v5-${{ env.TRACE2D_VCPKG_BASELINE }}
          enableCrossOsArchive: true
