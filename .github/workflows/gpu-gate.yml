name: GPU Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace2d-owner-gpu
  cancel-in-progress: true

env:
  TRACE2D_VCPKG_BASELINE: d92484ed3c5020c6679d095ad3e5add907887b62

jobs:
  owner-windows-gpu:
    if: github.repository == 'khsfashi/Trace2D'
    runs-on: [self-hosted, windows, x64, trace2d-gpu]
    timeout-minutes: 45

    steps:
      - name: Checkout trusted repository push
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $toolRoot = $env:RUNNER_TOOL_CACHE
          if ([string]::IsNullOrWhiteSpace($toolRoot)) {
            $toolRoot = Join-Path $env:RUNNER_TEMP 'trace2d-tool-cache'
          }
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null

          $vcpkgRoot = Join-Path $toolRoot "trace2d-vcpkg-$env:TRACE2D_VCPKG_BASELINE"
          if (-not (Test-Path (Join-Path $vcpkgRoot '.git') -PathType Container)) {
            git clone https://github.com/microsoft/vcpkg $vcpkgRoot
            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg clone failed with exit code $LASTEXITCODE."
            }
          }

          git -C $vcpkgRoot fetch origin $env:TRACE2D_VCPKG_BASELINE --depth 1
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline fetch failed with exit code $LASTEXITCODE."
          }
          git -C $vcpkgRoot checkout --force $env:TRACE2D_VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline checkout failed with exit code $LASTEXITCODE."
          }

          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path $vcpkgExe -PathType Leaf)) {
            & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg bootstrap failed with exit code $LASTEXITCODE."
            }
          }

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore shared vcpkg source downloads
        uses: actions/cache@v4
        with:
          path: .trace2d-vcpkg-downloads
          key: trace2d-vcpkg-downloads-v2-${{ env.TRACE2D_VCPKG_BASELINE }}

      - name: Seed shared downloads from persistent runner cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $sharedDownloads = Join-Path $env:GITHUB_WORKSPACE '.trace2d-vcpkg-downloads'
          $persistentDownloads = Join-Path $env:VCPKG_ROOT 'downloads'
          New-Item -ItemType Directory -Force -Path $sharedDownloads | Out-Null

          if (Test-Path $persistentDownloads -PathType Container) {
            Get-ChildItem -LiteralPath $persistentDownloads -Force | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $sharedDownloads -Recurse -Force
            }
          }

          "VCPKG_DOWNLOADS=$sharedDownloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run all real-GPU smoke and conformance tests
        shell: pwsh
        run: ./scripts/gpu_gate.ps1 -OutputDirectory artifacts/gpu-gate

      - name: Build Sprite SR8 final evidence manifest
        shell: pwsh
        run: |
          ./scripts/sprite_renderer_final_gate.ps1 `
            -OutputDirectory artifacts/sprite-renderer-final-gate `
            -ExistingGpuEvidenceDirectory artifacts/gpu-gate

      - name: Upload GPU gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-gate-${{ github.sha }}
          path: |
            artifacts/gpu-gate
            artifacts/sprite-renderer-final-gate
          if-no-files-found: warn
          retention-days: 30
