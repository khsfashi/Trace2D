name: Nightfall Layout Final Fix

on:
  push:
    branches: [game/nightfall-survivors]
    paths:
      - .github/workflows/nightfall-layout-fix-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: game/nightfall-survivors
      - name: Apply measured layout fixes
        shell: python
        run: |
          from pathlib import Path

          presentation = Path('examples/g1_nightfall_survivors/NightfallPresentationMeasured.cpp')
          contract = Path('examples/g1_nightfall_survivors/NightfallLayoutContractMain.cpp')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          # Stage preview tiles: four 0.875-wide tiles must exactly fit the 3.50-wide preview.
          replace_once(presentation,
              'X[i] - 1.31F + static_cast<float>(px) * 0.875F,',
              'X[i] - 1.3125F + static_cast<float>(px) * 0.875F,')
          replace_once(contract,
              'x[i] - 1.31F + static_cast<float>(px) * 0.875F,',
              'x[i] - 1.3125F + static_cast<float>(px) * 0.875F,')

          # Result screen: reserve deterministic vertical lanes for unlocks, actions, and help.
          replace_once(presentation,
              'const Rect panel = AddPanel(center.x, center.y, 11.20F, 7.00F, Panel, 0.99F, 51);',
              'const Rect panel = AddPanel(center.x, center.y, 11.20F, 8.40F, Panel, 0.99F, 51);')
          replace_once(contract,
              'const Rect panel = PanelRect(0.0F, 0.0F, 11.20F, 7.00F);',
              'const Rect panel = PanelRect(0.0F, 0.0F, 11.20F, 8.40F);')

          replace_once(presentation, 'float unlockY = center.y + 0.28F;', 'float unlockY = center.y + 0.30F;')
          replace_once(contract, 'float unlockY = 0.28F;', 'float unlockY = 0.30F;')
          replace_once(presentation, 'unlockY -= 0.48F;', 'unlockY -= 0.40F;')
          # Presentation has two 0.48 decrements (characters/stages); replace the remaining one too.
          text = presentation.read_text(encoding='utf-8')
          if text.count('unlockY -= 0.48F;') != 1:
              raise SystemExit('presentation: expected one remaining 0.48 unlock decrement')
          presentation.write_text(text.replace('unlockY -= 0.48F;', 'unlockY -= 0.40F;'), encoding='utf-8')

          text = contract.read_text(encoding='utf-8')
          if text.count('unlockY -= 0.48F;') != 2:
              raise SystemExit('contract: expected two 0.48 unlock decrements')
          contract.write_text(text.replace('unlockY -= 0.48F;', 'unlockY -= 0.40F;'), encoding='utf-8')

          replace_once(presentation, 'unlockY -= 0.44F;', 'unlockY -= 0.38F;')
          replace_once(contract, 'unlockY -= 0.44F;', 'unlockY -= 0.38F;')

          replace_once(presentation,
              'static_cast<void>(AddPanel(x, center.y - 2.30F, 3.90F, 0.76F, {0.10F, 0.28F, 0.44F, 1.0F}, 1.0F, 53));',
              'static_cast<void>(AddPanel(x, center.y - 3.24F, 3.90F, 0.76F, {0.10F, 0.28F, 0.44F, 1.0F}, 1.0F, 53));')
          replace_once(presentation,
              'static_cast<void>(AddText(items[i], x, center.y - 2.03F, BodyPpu, selected ? White : Muted, true, 74));',
              'static_cast<void>(AddText(items[i], x, center.y - 3.00F, BodyPpu, selected ? White : Muted, true, 74));')
          replace_once(contract,
              'const Rect retry = Text("다시 도전", -2.35F, -2.03F, BodyPpu, true);',
              'const Rect retry = Text("다시 도전", -2.35F, -3.00F, BodyPpu, true);')
          replace_once(contract,
              'const Rect menu = Text("메인 메뉴", 2.35F, -2.03F, BodyPpu, true);',
              'const Rect menu = Text("메인 메뉴", 2.35F, -3.00F, BodyPpu, true);')
          replace_once(presentation,
              'static_cast<void>(AddText("W/S 선택  ·  ENTER 확인", center.x, center.y - 3.15F, TinyPpu, Dim, true, 74));',
              'static_cast<void>(AddText("W/S 선택  ·  ENTER 확인", center.x, center.y - 3.68F, TinyPpu, Dim, true, 74));')
          replace_once(contract,
              'const Rect help = Text("W/S 선택  ·  ENTER 확인", 0.0F, -3.15F, TinyPpu, true);',
              'const Rect help = Text("W/S 선택  ·  ENTER 확인", 0.0F, -3.68F, TinyPpu, true);')

          # The contract's worst-case must be reachable by progression rules: at most
          # two characters, one stage, and five achievements can become newly unlocked
          # in a single run. Testing every definition at once creates an impossible state.
          replace_once(contract,
              'for (std::size_t i = 0U; i < NightfallProduct::CharacterCount(); ++i)\n            {\n                const Rect line = Text("새 캐릭터  ·  " + std::string{NightfallProduct::Character(static_cast<CharacterId>(i)).nameKo},',
              'for (std::size_t i = 0U; i < 2U; ++i)\n            {\n                const Rect line = Text("새 캐릭터  ·  " + std::string{NightfallProduct::Character(static_cast<CharacterId>(i + 1U)).nameKo},')
          replace_once(contract,
              'for (std::size_t i = 0U; i < NightfallProduct::StageCount(); ++i)\n            {\n                const Rect line = Text("새 스테이지  ·  " + std::string{NightfallProduct::Stage(static_cast<StageId>(i)).nameKo},',
              'for (std::size_t i = 0U; i < 1U; ++i)\n            {\n                const Rect line = Text("새 스테이지  ·  " + std::string{NightfallProduct::Stage(static_cast<StageId>(i + 1U)).nameKo},')
          replace_once(contract,
              'for (std::size_t i = 0U; i < NightfallProduct::AchievementCount(); ++i)\n            {',
              'for (std::size_t i = 0U; i < 5U; ++i)\n            {')

          # Runtime presentation must also fail closed if any real unlock line escapes.
          replace_once(presentation,
              'static_cast<void>(AddText("새 캐릭터  ·  " + std::string{NightfallProduct::Character(static_cast<CharacterId>(i)).nameKo},\n                center.x, unlockY, TinyPpu, CharacterAccent(i), true, 74));',
              'const Rect unlockLine = AddText("새 캐릭터  ·  " + std::string{NightfallProduct::Character(static_cast<CharacterId>(i)).nameKo},\n                center.x, unlockY, TinyPpu, CharacterAccent(i), true, 74);\n            RequireInside("result.unlock.character", unlockLine, "result.panel", panel, 0.18F);')
          replace_once(presentation,
              'static_cast<void>(AddText("새 스테이지  ·  " + std::string{NightfallProduct::Stage(static_cast<StageId>(i)).nameKo},\n                center.x, unlockY, TinyPpu, StageAccent(i), true, 74));',
              'const Rect unlockLine = AddText("새 스테이지  ·  " + std::string{NightfallProduct::Stage(static_cast<StageId>(i)).nameKo},\n                center.x, unlockY, TinyPpu, StageAccent(i), true, 74);\n            RequireInside("result.unlock.stage", unlockLine, "result.panel", panel, 0.18F);')
          replace_once(presentation,
              'static_cast<void>(AddText("새 업적  ·  " + std::string{NightfallProduct::Achievement(static_cast<AchievementId>(i)).nameKo},\n                center.x, unlockY, TinyPpu, Green, true, 74));',
              'const Rect unlockLine = AddText("새 업적  ·  " + std::string{NightfallProduct::Achievement(static_cast<AchievementId>(i)).nameKo},\n                center.x, unlockY, TinyPpu, Green, true, 74);\n            RequireInside("result.unlock.achievement", unlockLine, "result.panel", panel, 0.18F);')
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nightfall-layout-fix-final.yml
          git add examples/g1_nightfall_survivors/NightfallPresentationMeasured.cpp examples/g1_nightfall_survivors/NightfallLayoutContractMain.cpp
          git commit -m "fix: close Nightfall measured layout violations"
          git push origin HEAD:game/nightfall-survivors
