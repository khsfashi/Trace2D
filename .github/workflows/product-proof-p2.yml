name: P2 Combat Product Proof

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - "examples/p2_combat_gamefeel/**"
      - "examples/CMakeLists.txt"
      - ".github/workflows/product-proof-p2.yml"
  pull_request:
    branches:
      - main
    paths:
      - "examples/p2_combat_gamefeel/**"
      - "examples/CMakeLists.txt"
      - ".github/workflows/product-proof-p2.yml"

permissions:
  contents: read

concurrency:
  group: trace2d-p2-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TRACE2D_VCPKG_BASELINE: d92484ed3c5020c6679d095ad3e5add907887b62

jobs:
  windows-combat-proof:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgDownloads = Join-Path $env:GITHUB_WORKSPACE ".trace2d-vcpkg-downloads"
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          git -C $vcpkgRoot checkout $env:TRACE2D_VCPKG_BASELINE
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $vcpkgDownloads | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=$vcpkgDownloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg source downloads
        uses: actions/cache/restore@v6
        with:
          path: .trace2d-vcpkg-downloads
          key: trace2d-vcpkg-downloads-v5-${{ env.TRACE2D_VCPKG_BASELINE }}
          enableCrossOsArchive: true

      - name: Configure Trace2D source tree
        run: cmake --preset windows-msvc

      - name: Build debug P2 for deterministic verification
        run: >-
          cmake --build --preset windows-debug --parallel
          --target trace2d_p2_combat_gamefeel_headless trace2d_p2_combat_gamefeel_profile trace2d_p2_combat_gamefeel_windowed

      - name: Verify deterministic combat trajectory
        run: ctest --preset windows-debug -R "^trace2d_p2_combat_gamefeel_headless$" --output-on-failure

      - name: Build release SDK closure and owner proof
        run: >-
          cmake --build --preset windows-release --parallel
          --target trace2d_application trace2d_agent trace2d_audio trace2d_physics
          trace2d_platform trace2d_profile trace2d_profile_adapters trace2d_render trace2d_tile trace2d_text
          trace2d_p2_combat_gamefeel_headless trace2d_p2_combat_gamefeel_profile trace2d_p2_combat_gamefeel_windowed

      - name: Install release candidate Trace2D SDK
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "trace2d-p2-sdk-release"
          cmake --install "build/windows-msvc" --config Release --prefix $installRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TRACE2D_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure P2 as a clean installed-SDK consumer
        working-directory: examples/p2_combat_gamefeel
        run: cmake --preset windows-msvc

      - name: Build release P2 as a clean installed-SDK consumer
        working-directory: examples/p2_combat_gamefeel
        run: cmake --build --preset windows-release --parallel

      - name: Verify standalone release deterministic combat trajectory
        working-directory: examples/p2_combat_gamefeel
        run: ctest --preset windows-release

      - name: Upload release owner-review Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace2d-p2-combat-gamefeel-windows-release
          path: |
            examples/p2_combat_gamefeel/build/windows-msvc/Release
            examples/p2_combat_gamefeel/README.md
          if-no-files-found: error
          retention-days: 30
