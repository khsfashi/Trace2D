name: Sanitizers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace2d-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TRACE2D_VCPKG_BASELINE: d92484ed3c5020c6679d095ad3e5add907887b62

jobs:
  linux-clang-asan-ubsan-headless:
    name: Linux Clang ASan + UBSan headless
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Clang toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          cmake --version
          clang_version="$(clang++ -dumpfullversion -dumpversion)"
          test -n "$clang_version"
          echo "clang-version=$clang_version" >> "$GITHUB_OUTPUT"

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's Ubuntu images may prefer an Azure-local Ubuntu mirror. Keep the
          # sanitizer gate independent of that mirror's availability by using the
          # canonical Ubuntu archive when the runner exposes the mirror list.
          apt_mirror_list="/etc/apt/apt-mirrors.txt"
          if [[ -f "$apt_mirror_list" ]]; then
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "$apt_mirror_list"
          fi

          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends \
            autoconf \
            autoconf-archive \
            automake \
            libltdl-dev \
            libtool \
            ninja-build \
            pkg-config

      - name: Install pinned vcpkg
        shell: bash
        run: |
          set -euo pipefail
          vcpkg_root="$RUNNER_TEMP/vcpkg"
          git clone https://github.com/microsoft/vcpkg "$vcpkg_root"
          git -C "$vcpkg_root" checkout "$TRACE2D_VCPKG_BASELINE"
          "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"

      - name: Restore vcpkg source downloads
        uses: actions/cache/restore@v4
        with:
          path: .trace2d-vcpkg-downloads
          key: trace2d-vcpkg-downloads-v5-${{ env.TRACE2D_VCPKG_BASELINE }}
          enableCrossOsArchive: true

      - name: Restore Linux vcpkg binary archives
        id: vcpkg-binary-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: trace2d-sanitizer-vcpkg-${{ runner.os }}-${{ runner.arch }}-clang-${{ steps.toolchain.outputs.clang-version }}-${{ env.TRACE2D_VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure sanitizer verification build
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          mkdir -p .trace2d-vcpkg-downloads
          export VCPKG_DOWNLOADS="$GITHUB_WORKSPACE/.trace2d-vcpkg-downloads"
          cmake -S . -B build/sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DTRACE2D_WARNINGS_AS_ERRORS=ON \
            -DTRACE2D_INSTALL_SDK=OFF \
            -DTRACE2D_ENABLE_ASAN_UBSAN=ON \
            -DBUILD_TESTING=ON

      - name: Build headless sanitizer targets
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/sanitizers --parallel --target \
            trace2d_profile_cli \
            trace2d_profile_tests \
            trace2d_runtime_tests \
            trace2d_scene_tests \
            trace2d_physics_tests \
            trace2d_assets_tests \
            trace2d_audio_tests

      - name: Run ASan + UBSan headless suites
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/sanitizers \
            -L sanitizer-headless \
            --output-on-failure

      - name: Save Linux vcpkg binary archives
        if: always() && steps.vcpkg-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: trace2d-sanitizer-vcpkg-${{ runner.os }}-${{ runner.arch }}-clang-${{ steps.toolchain.outputs.clang-version }}-${{ env.TRACE2D_VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}