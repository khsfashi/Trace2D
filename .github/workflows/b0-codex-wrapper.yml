name: B0 Codex Wrapper

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  codex-wrapper-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test frozen Codex wrapper without model access
        working-directory: scripts
        run: python3 -m unittest test_benchmark_b0_codex_wrapper.py test_benchmark_b0_codex_chatgpt_wrapper.py

      - name: Test rejected calibration entrypoint fails closed
        working-directory: scripts
        run: python3 -m unittest test_benchmark_b0_codex_chatgpt_safe_runner.py

      - name: Test Windows ACL isolation probe helpers
        working-directory: scripts
        run: python3 -m unittest test_benchmark_b0_windows_acl_isolation.py

      - name: Test scrubbed evidence packaging
        working-directory: scripts
        run: python3 -m unittest test_benchmark_b0_evidence_packager.py

      - name: Parse-check owner-local setup PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/run_benchmark_b0_codex_calibration.ps1").Path,
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Compile-check retired calibration and ACL qualification tooling
        run: python3 -m py_compile scripts/run_benchmark_b0_codex_chatgpt_calibration.py scripts/run_benchmark_b0_codex_chatgpt_calibration_safe.py scripts/benchmark_b0_codex_chatgpt_wrapper.py scripts/qualify_benchmark_b0_windows_acl_isolation.py

      - name: Validate frozen Codex model/budget profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          import benchmark_b0

          suite = benchmark_b0.validate_suite(Path('benchmarks/b0/suite.json').resolve())
          task = benchmark_b0.find_task(suite, 'b0-semantic-scene-authoring')
          profile = benchmark_b0.validate_agent_profile(
              Path('benchmarks/b0/agent-profile.codex-0.144.6.json').resolve(),
              task,
          )
          assert profile['agent_id'] == 'openai-codex-cli@0.144.6'
          assert profile['model_id'] == 'gpt-5.5'
          assert profile['model_revision'] == 'gpt-5.5'
          assert profile['settings']['provider_revision_policy'] == 'chatgpt_codex_cli_selector_no_dated_snapshot'
          print(json.dumps({
              'status': 'ok',
              'agent_id': profile['agent_id'],
              'model_id': profile['model_id'],
              'model_revision': profile['model_revision'],
          }))
          PY
