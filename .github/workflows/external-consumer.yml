name: External Consumer SDK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  TRACE2D_VCPKG_BASELINE: d92484ed3c5020c6679d095ad3e5add907887b62

jobs:
  windows-msvc-external-consumer:
    runs-on: windows-2022

    steps:
      - name: Checkout clean candidate
        uses: actions/checkout@v6

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          git -C $vcpkgRoot checkout $env:TRACE2D_VCPKG_BASELINE
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Trace2D SDK source tree
        run: cmake --preset windows-msvc

      - name: Build exported SDK target closure
        run: cmake --build build/windows-msvc --config Debug --parallel --target trace2d_application trace2d_agent trace2d_platform trace2d_render

      - name: Validate install, package, doctor, and external consumer
        shell: pwsh
        run: |
          ./scripts/external_consumer_gate.ps1 `
            -BuildDirectory "build/windows-msvc" `
            -VcpkgRoot "$env:VCPKG_ROOT" `
            -Configuration Debug `
            -ConfigurePreset windows-msvc `
            -EvidenceDirectory "$env:RUNNER_TEMP/trace2d-e1-external-consumer"

      - name: Upload E1 package and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace2d-e1-external-consumer-evidence
          path: ${{ runner.temp }}/trace2d-e1-external-consumer
          if-no-files-found: warn
          retention-days: 30
