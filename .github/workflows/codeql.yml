name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-cpp:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
      packages: read

    env:
      TRACE2D_VCPKG_BASELINE: d92484ed3c5020c6679d095ad3e5add907887b62

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          git -C $vcpkgRoot checkout $env:TRACE2D_VCPKG_BASELINE
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset ci-windows-msvc

      - name: Build for analysis
        run: cmake --build --preset ci-windows-debug --parallel

      - name: Analyze
        uses: github/codeql-action/analyze@v4
