name: Nightfall stats layout fix once

on:
  push:
    branches:
      - game/nightfall-survivors
    paths:
      - ".nightfall-layout-fix2-trigger"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: game/nightfall-survivors
          fetch-depth: 0
      - name: Shift right-side stats into measured safe area
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('examples/g1_nightfall_survivors/NightfallPresentationMeasured.cpp'): [
                  ('AddText("전투 기록", 3.05F, 1.82F', 'AddText("전투 기록", 2.65F, 1.82F'),
                  ('std::to_string(profile.stars), 3.05F, 1.23F', 'std::to_string(profile.stars), 2.65F, 1.23F'),
                  ('std::to_string(profile.totalRuns) + "회", 3.05F, 0.54F', 'std::to_string(profile.totalRuns) + "회", 2.65F, 0.54F'),
                  ('std::to_string(profile.totalClears) + "회", 3.05F, -0.05F', 'std::to_string(profile.totalClears) + "회", 2.65F, -0.05F'),
                  ('std::to_string(profile.totalKills), 3.05F, -0.64F', 'std::to_string(profile.totalKills), 2.65F, -0.64F'),
                  ('std::to_string(profile.bestLevel), 3.05F, -1.23F', 'std::to_string(profile.bestLevel), 2.65F, -1.23F'),
              ],
              Path('examples/g1_nightfall_survivors/NightfallLayoutContractMain.cpp'): [
                  ('Text("전투 기록", 3.05F, 1.82F', 'Text("전투 기록", 2.65F, 1.82F'),
                  ('Text(starsText, 3.05F, 1.23F', 'Text(starsText, 2.65F, 1.23F'),
                  ('Text(runsText, 3.05F, 0.54F', 'Text(runsText, 2.65F, 0.54F'),
                  ('Text(clearsText, 3.05F, -0.05F', 'Text(clearsText, 2.65F, -0.05F'),
                  ('Text(killsText, 3.05F, -0.64F', 'Text(killsText, 2.65F, -0.64F'),
                  ('Text(levelText, 3.05F, -1.23F', 'Text(levelText, 2.65F, -1.23F'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/g1_nightfall_survivors/NightfallPresentationMeasured.cpp examples/g1_nightfall_survivors/NightfallLayoutContractMain.cpp
          git commit -m "fix: keep Nightfall profile stats inside safe panel"
          git push origin HEAD:game/nightfall-survivors
