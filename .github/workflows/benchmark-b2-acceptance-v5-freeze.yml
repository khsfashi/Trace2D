name: Benchmark B2 Acceptance V5 Freeze

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - ".gitattributes"
      - "benchmarks/b2/acceptance/contract-v4.json"
      - "benchmarks/b2/acceptance/contract-v5.json"
      - "benchmarks/b2/acceptance/tasks/ember-hall-v2/PROMPT.md"
      - "scripts/benchmark_b2_acceptance_v4_freeze.py"
      - "scripts/benchmark_b2_acceptance_v5_freeze.py"
      - "scripts/test_benchmark_b2_acceptance_v4_freeze.py"
      - "scripts/test_benchmark_b2_acceptance_v5_freeze.py"
      - "scripts/benchmark_b2_agent_outcome.py"
      - "scripts/test_benchmark_b2_agent_outcome.py"
      - "scripts/benchmark_b2_codex_windows_acl_wrapper.py"
      - ".github/workflows/benchmark-b2-owner-agent-readiness.yml"
      - ".github/workflows/benchmark-b2-acceptance-v5-freeze.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".gitattributes"
      - "benchmarks/b2/acceptance/contract-v4.json"
      - "benchmarks/b2/acceptance/contract-v5.json"
      - "benchmarks/b2/acceptance/tasks/ember-hall-v2/PROMPT.md"
      - "scripts/benchmark_b2_acceptance_v4_freeze.py"
      - "scripts/benchmark_b2_acceptance_v5_freeze.py"
      - "scripts/test_benchmark_b2_acceptance_v4_freeze.py"
      - "scripts/test_benchmark_b2_acceptance_v5_freeze.py"
      - "scripts/benchmark_b2_agent_outcome.py"
      - "scripts/test_benchmark_b2_agent_outcome.py"
      - "scripts/benchmark_b2_codex_windows_acl_wrapper.py"
      - ".github/workflows/benchmark-b2-owner-agent-readiness.yml"
      - ".github/workflows/benchmark-b2-acceptance-v5-freeze.yml"

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate append-only V5 freeze
        run: python3 -m scripts.benchmark_b2_acceptance_v5_freeze

      - name: Run V5 freeze regressions
        run: python3 -m unittest scripts.test_benchmark_b2_acceptance_v5_freeze

      - name: Revalidate consumed V4 and Agent outcome precedence
        run: |
          python3 -m scripts.benchmark_b2_acceptance_v4_freeze
          python3 -m unittest scripts.test_benchmark_b2_acceptance_v4_freeze
          python3 -m unittest scripts.test_benchmark_b2_agent_outcome

      - name: Syntax-check V5 freeze tooling
        run: |
          python3 -m py_compile \
            scripts/benchmark_b2_acceptance_v5_freeze.py \
            scripts/test_benchmark_b2_acceptance_v5_freeze.py
