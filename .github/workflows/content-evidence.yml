name: Content Evidence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: trace2d-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-content-evidence:
    name: validate-content-evidence
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run C0/C1 content tooling fixture tests
        run: python3 -m unittest discover -s scripts/tests -p "test_content_*.py" -v

  derive-main-candidate:
    name: derive-main-candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-content-evidence
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout final main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive C0 candidate from final-main evidence
        run: |
          python3 scripts/content_fact_pack.py extract \
            --commit "$GITHUB_SHA" \
            --source-event merge \
            --event-id "$GITHUB_SHA"

      - name: Detect generated candidate
        id: candidate
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- content/candidates)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated evidence to automation branch
        if: steps.candidate.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          branch="automation/content-candidate-${short_sha}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add content/candidates
          git commit -m "Record content candidate for ${short_sha}" -m "Content: none"
          git push --force origin "HEAD:${branch}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open draft evidence PR when needed
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          existing="$(gh pr list --state open --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Draft content-evidence PR #$existing already exists for $BRANCH_NAME"
            exit 0
          fi

          cat > "$RUNNER_TEMP/content-pr-body.md" <<EOF
          ## Summary

          Automatically derived a C0 Content Candidate / Fact Pack from final-main commit \`$GITHUB_SHA\`.

          This PR contains structured repository evidence only. It does not generate article/social prose, invoke C1/#109, publish externally, or alter the core engine progression lane.

          Generated by \`scripts/content_fact_pack.py\` from durable commit trailers. Review/edit/discard this candidate independently of engine work.

          ## Squash knowledge

          \`\`\`text
          Issue: #108
          Area: content-tooling
          Decision: Store derived development evidence as a reviewable Fact Pack
          Constraint: Content evidence automation is non-blocking and never invokes drafting/publication
          Tested: content Fact Pack extractor completed for final-main commit $GITHUB_SHA
          Content: none
          \`\`\`
          EOF

          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Record content candidate for ${GITHUB_SHA:0:12}" \
            --body-file "$RUNNER_TEMP/content-pr-body.md"
