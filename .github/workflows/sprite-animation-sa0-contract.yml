name: Sprite SA0 Contract

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sprite-sa0-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate frozen Sprite animation timing contract
        working-directory: scripts
        run: python3 -m unittest test_sprite_animation_sa0_contract.py

      - name: Compile-check contract test
        run: python3 -m py_compile scripts/test_sprite_animation_sa0_contract.py
