name: Benchmark B2 Non-Scored Diagnostic Capture Export

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: trace2d-owner-b2-nonscored-diagnostic
  cancel-in-progress: false

jobs:
  owner-windows-diagnostic:
    if: >-
      github.repository == 'khsfashi/Trace2D' &&
      github.actor == 'khsfashi' &&
      github.run_attempt == 1 &&
      github.event.issue.number == 104 &&
      github.ref == 'refs/heads/main' &&
      github.event.comment.body == '/b2 accept-diagnostic'
    runs-on: [self-hosted, windows, x64, trace2d-gpu]
    timeout-minutes: 10

    steps:
      - name: Emit existing failed-candidate captures read-only
        shell: pwsh
        env:
          TRACE2D_DIAGNOSTIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACE2D_DIAGNOSTIC_REPOSITORY: ${{ github.repository }}
          TRACE2D_DIAGNOSTIC_ISSUE: ${{ github.event.issue.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $runsRoot = [System.IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'Trace2D\benchmark-b2-acceptance-v1'))
          if ($runsRoot.ToLowerInvariant().Contains('benchmark-b2-scored-v1')) {
            throw 'Diagnostic export must never read the scored durable root.'
          }
          $initialRoot = Join-Path $runsRoot 'initial'
          if (-not (Test-Path -LiteralPath $initialRoot -PathType Container)) {
            throw "Acceptance initial root is missing: $initialRoot"
          }

          $records = @(Get-ChildItem -LiteralPath $initialRoot -Filter 'record.json' -Recurse -File | Sort-Object FullName)
          if ($records.Count -eq 0) {
            throw 'No retained non-scored acceptance records were found.'
          }

          $headers = @{
            Authorization = "Bearer $env:TRACE2D_DIAGNOSTIC_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'Trace2D-B2-Diagnostic'
          }
          $commentsUri = "https://api.github.com/repos/$env:TRACE2D_DIAGNOSTIC_REPOSITORY/issues/$env:TRACE2D_DIAGNOSTIC_ISSUE/comments"

          $emitted = 0
          foreach ($recordFile in $records) {
            $record = Get-Content -Raw -Encoding utf8 -LiteralPath $recordFile.FullName | ConvertFrom-Json
            if ($record.scored -ne $false) {
              throw "Refusing non-diagnostic record with scored != false: $($recordFile.FullName)"
            }
            if ([string]$record.kind -ne 'trace2d_b2_nonscored_acceptance_initial') {
              throw "Unexpected acceptance record kind: $($record.kind)"
            }

            $workspace = [System.IO.Path]::GetFullPath([string]$record.artifacts.workspace)
            $rootPrefix = $runsRoot.TrimEnd('\') + '\'
            if (-not $workspace.StartsWith($rootPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Retained workspace escaped the non-scored durable root: $workspace"
            }

            foreach ($capture in @($record.presentation.captures)) {
              $relative = [string]$capture.path
              if ([string]::IsNullOrWhiteSpace($relative)) {
                throw "Capture path missing for trial $($record.trial_id)"
              }
              $candidate = [System.IO.Path]::GetFullPath((Join-Path $workspace ($relative -replace '/', '\')))
              $workspacePrefix = $workspace.TrimEnd('\') + '\'
              if (-not $candidate.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "Capture escaped retained workspace: $candidate"
              }
              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                throw "Retained capture is missing: $candidate"
              }

              $sha = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
              $expectedSha = ([string]$capture.sha256).ToLowerInvariant()
              if ($sha -ne $expectedSha) {
                throw "Retained capture SHA-256 mismatch for $($record.trial_id): expected $expectedSha, got $sha"
              }

              $bytes = [System.IO.File]::ReadAllBytes($candidate)
              $base64 = [Convert]::ToBase64String($bytes)
              $metadata = [ordered]@{
                schema_version = 1
                kind = 'trace2d_b2_nonscored_diagnostic_capture'
                diagnostic_only = $true
                acceptance_authority = $false
                scored = $false
                trial_id = [string]$record.trial_id
                run_index = [int]$record.run_index
                status = [string]$record.status
                deterministic_pass = ([string]$record.deterministic_verifier.verdict.status -eq 'pass')
                agent_identity_ok = [bool]$record.agent_identity_ok
                capture_path = $relative
                capture_sha256 = $sha
                byte_count = $bytes.Length
              }
              $metadataJson = $metadata | ConvertTo-Json -Compress

              Write-Host 'TRACE2D_B2_DIAGNOSTIC_CAPTURE_BEGIN'
              Write-Host $metadataJson
              Write-Host 'TRACE2D_B2_DIAGNOSTIC_BASE64_BEGIN'
              Write-Host $base64
              Write-Host 'TRACE2D_B2_DIAGNOSTIC_BASE64_END'
              Write-Host 'TRACE2D_B2_DIAGNOSTIC_CAPTURE_END'

              $commentBody = @(
                '<!-- TRACE2D_B2_DIAGNOSTIC_CAPTURE -->',
                'Diagnostic-only retained B2 acceptance capture. This is not scoring or acceptance authority.',
                "TRACE2D_B2_DIAGNOSTIC_METADATA=$metadataJson",
                'TRACE2D_B2_DIAGNOSTIC_BASE64_BEGIN',
                $base64,
                'TRACE2D_B2_DIAGNOSTIC_BASE64_END'
              ) -join "`n"
              $payload = @{ body = $commentBody } | ConvertTo-Json -Compress
              Invoke-RestMethod -Uri $commentsUri -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
              $emitted += 1
            }
          }

          if ($emitted -eq 0) {
            throw 'Retained records exist but contain no presentation captures.'
          }
          Write-Host "TRACE2D_B2_DIAGNOSTIC_CAPTURE_COUNT=$emitted"

  hosted-image-publish:
    if: >-
      github.repository == 'khsfashi/Trace2D' &&
      github.actor == 'khsfashi' &&
      github.run_attempt == 1 &&
      github.event.issue.number == 104 &&
      github.ref == 'refs/heads/main' &&
      github.event.comment.body == '/b2 accept-diagnostic-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish retained diagnostic comments as exact PNG evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACE2D_DIAGNOSTIC_REPOSITORY: ${{ github.repository }}
          TRACE2D_DIAGNOSTIC_ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["TRACE2D_DIAGNOSTIC_REPOSITORY"]
          issue = os.environ["TRACE2D_DIAGNOSTIC_ISSUE"]
          main_sha = os.environ["GITHUB_SHA"]
          evidence_branch = "b2-diagnostic-captures"
          api_root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Trace2D-B2-Diagnostic-Publisher",
          }

          def api(method: str, url: str, payload=None):
              data = None
              req_headers = dict(headers)
              if payload is not None:
                  data = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  req_headers["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=data, headers=req_headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  if not raw:
                      return None
                  return json.loads(raw.decode("utf-8"))

          comments = []
          page = 1
          while True:
              batch = api("GET", f"{api_root}/issues/{issue}/comments?per_page=100&page={page}")
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          latest = {}
          marker = "<!-- TRACE2D_B2_DIAGNOSTIC_CAPTURE -->"
          meta_prefix = "TRACE2D_B2_DIAGNOSTIC_METADATA="
          begin_marker = "TRACE2D_B2_DIAGNOSTIC_BASE64_BEGIN"
          end_marker = "TRACE2D_B2_DIAGNOSTIC_BASE64_END"

          for comment in comments:
              body = comment.get("body") or ""
              if marker not in body:
                  continue
              lines = body.splitlines()
              meta_line = next((line for line in lines if line.startswith(meta_prefix)), None)
              if meta_line is None or begin_marker not in lines or end_marker not in lines:
                  continue
              begin = lines.index(begin_marker)
              end = lines.index(end_marker, begin + 1)
              encoded = "".join(lines[begin + 1 : end]).strip()
              metadata = json.loads(meta_line[len(meta_prefix) :])
              if metadata.get("diagnostic_only") is not True:
                  raise RuntimeError("Diagnostic comment lost diagnostic_only=true.")
              if metadata.get("acceptance_authority") is not False:
                  raise RuntimeError("Diagnostic comment unexpectedly has acceptance authority.")
              if metadata.get("scored") is not False:
                  raise RuntimeError("Diagnostic comment unexpectedly has scored=true.")
              data = base64.b64decode(encoded, validate=True)
              sha = hashlib.sha256(data).hexdigest()
              if sha != metadata.get("capture_sha256"):
                  raise RuntimeError(f"SHA mismatch for {metadata.get('trial_id')}: {sha}")
              if len(data) != int(metadata.get("byte_count", -1)):
                  raise RuntimeError(f"Byte-count mismatch for {metadata.get('trial_id')}")
              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise RuntimeError(f"Not a PNG: {metadata.get('trial_id')}")
              latest[str(metadata["trial_id"])] = (metadata, encoded)

          expected = {
              "accept-initial-01-trace2d-agent",
              "accept-initial-02-trace2d-agent",
          }
          missing = expected.difference(latest)
          if missing:
              raise RuntimeError(f"Missing retained diagnostic comments: {sorted(missing)}")

          tree_items = []
          rows = []
          for trial_id in sorted(expected):
              metadata, encoded = latest[trial_id]
              blob = api("POST", f"{api_root}/git/blobs", {"content": encoded, "encoding": "base64"})
              run_index = int(metadata["run_index"])
              repo_path = f"diagnostics/b2/acceptance-v1/ember-hall-initial-{run_index:02d}.png"
              tree_items.append({"path": repo_path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
              raw_url = f"https://raw.githubusercontent.com/{repo}/{evidence_branch}/{repo_path}"
              rows.append((metadata, raw_url))

          main_commit = api("GET", f"{api_root}/git/commits/{main_sha}")
          tree = api("POST", f"{api_root}/git/trees", {"base_tree": main_commit["tree"]["sha"], "tree": tree_items})
          commit = api(
              "POST",
              f"{api_root}/git/commits",
              {
                  "message": "chore(b2): publish non-scored diagnostic captures",
                  "tree": tree["sha"],
                  "parents": [main_sha],
              },
          )

          try:
              api("GET", f"{api_root}/git/ref/heads/{evidence_branch}")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              api("POST", f"{api_root}/git/refs", {"ref": f"refs/heads/{evidence_branch}", "sha": commit["sha"]})
          else:
              api("PATCH", f"{api_root}/git/refs/heads/{evidence_branch}", {"sha": commit["sha"], "force": True})

          lines = [
              "<!-- TRACE2D_B2_DIAGNOSTIC_IMAGES -->",
              "## B2 non-scored diagnostic captures",
              "",
              "> Diagnostic only. These images are **not** scoring or acceptance authority and do not change the frozen B2 cohort or acceptance result.",
              "",
          ]
          for metadata, raw_url in rows:
              lines.extend(
                  [
                      f"### {metadata['trial_id']} — {metadata['status']}",
                      f"SHA-256: `{metadata['capture_sha256']}`",
                      f"![Diagnostic capture {metadata['run_index']}]({raw_url})",
                      "",
                  ]
              )
          lines.append(f"Evidence branch: `{evidence_branch}` @ `{commit['sha']}`")
          api("POST", f"{api_root}/issues/{issue}/comments", {"body": "\n".join(lines)})
          print(f"TRACE2D_B2_DIAGNOSTIC_IMAGE_BRANCH={evidence_branch}")
          print(f"TRACE2D_B2_DIAGNOSTIC_IMAGE_COMMIT={commit['sha']}")
          print(f"TRACE2D_B2_DIAGNOSTIC_IMAGE_COUNT={len(rows)}")
          PY
