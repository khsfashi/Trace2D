name: SAVE1 Windows diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  TRACE2D_VCPKG_BASELINE: d92484ed3c5020c6679d095ad3e5add907887b62

jobs:
  windows-ctest-diagnostics:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgDownloads = Join-Path $env:GITHUB_WORKSPACE ".trace2d-vcpkg-downloads"
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          git -C $vcpkgRoot checkout $env:TRACE2D_VCPKG_BASELINE
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $vcpkgDownloads | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=$vcpkgDownloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-debug --parallel

      - name: Test
        id: ctest
        continue-on-error: true
        run: ctest --preset windows-debug

      - name: Collect CTest diagnostics
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "save1-ctest-diagnostics"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE "build/windows-msvc/Testing/Temporary/LastTest.log"
          if (Test-Path $log) {
            Copy-Item $log (Join-Path $out "LastTest.log")
          }
          ctest --test-dir build/windows-msvc -C Debug -N | Out-File -FilePath (Join-Path $out "test-list.txt") -Encoding utf8

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save1-windows-ctest-diagnostics
          path: ${{ runner.temp }}/save1-ctest-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Propagate CTest failure
        if: steps.ctest.outcome == 'failure'
        shell: pwsh
        run: exit 1
