name: SAVE1 Windows diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  TRACE2D_VCPKG_BASELINE: d92484ed3c5020c6679d095ad3e5add907887b62

jobs:
  apply-save1-scalar-fix:
    if: github.event.pull_request.number == 398
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Replace scalar JSON initializer-list construction
        shell: python
        run: |
          from pathlib import Path

          path = Path("engine/persistence/src/SaveDocument.cpp")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "return OrderedJson{value.booleanValue};": "return OrderedJson(value.booleanValue);",
              "return OrderedJson{value.signedIntegerValue};": "return OrderedJson(value.signedIntegerValue);",
              "return OrderedJson{value.unsignedIntegerValue};": "return OrderedJson(value.unsignedIntegerValue);",
              "return OrderedJson{value.floatValue};": "return OrderedJson(value.floatValue);",
              "return OrderedJson{value.textValue};": "return OrderedJson(value.textValue);",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

      - name: Commit exact fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- engine/persistence/src/SaveDocument.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/persistence/src/SaveDocument.cpp
          git commit -m "fix: serialize SAVE1 semantic scalars as JSON scalars"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  windows-ctest-diagnostics:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgDownloads = Join-Path $env:GITHUB_WORKSPACE ".trace2d-vcpkg-downloads"
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          git -C $vcpkgRoot checkout $env:TRACE2D_VCPKG_BASELINE
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $vcpkgDownloads | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=$vcpkgDownloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-debug --parallel

      - name: Test
        id: ctest
        continue-on-error: true
        run: ctest --preset windows-debug

      - name: Collect CTest diagnostics
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "save1-ctest-diagnostics"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE "build/windows-msvc/Testing/Temporary/LastTest.log"
          if (Test-Path $log) {
            Copy-Item $log (Join-Path $out "LastTest.log")
          }
          ctest --test-dir build/windows-msvc -C Debug -N | Out-File -FilePath (Join-Path $out "test-list.txt") -Encoding utf8

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save1-windows-ctest-diagnostics
          path: ${{ runner.temp }}/save1-ctest-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Propagate CTest failure
        if: steps.ctest.outcome == 'failure'
        shell: pwsh
        run: exit 1
