name: Benchmark B2 Baseline Qualification

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "benchmarks/b2/qualification/**"
      - "scripts/qualify_b2_godot_agent_loop.py"
      - "scripts/qualify_b2_godot_mcp_satellite.py"
      - "scripts/qualify_godot_agent_mcp.py"
      - "scripts/qualify_godot_agent_mcp_live.py"
      - ".github/workflows/benchmark-b2-baseline-qualification.yml"
  pull_request:
    branches:
      - main
    paths:
      - "benchmarks/b2/qualification/**"
      - "scripts/qualify_b2_godot_agent_loop.py"
      - "scripts/qualify_b2_godot_mcp_satellite.py"
      - "scripts/qualify_godot_agent_mcp.py"
      - "scripts/qualify_godot_agent_mcp_live.py"
      - ".github/workflows/benchmark-b2-baseline-qualification.yml"

permissions:
  contents: read

env:
  TRACE2D_B2_GODOT_VERSION: 4.7.1-stable
  TRACE2D_B2_AGENT_LOOP_PACKAGE: "@beremaran/godot-agent-loop@3.0.0"
  TRACE2D_B2_AGENT_LOOP_SOURCE_COMMIT: 7bc6062f90e2f96a04f997b202f7a24dd152a9fd
  TRACE2D_B2_SATELLITE_PACKAGE: "@satelliteoflove/godot-mcp@4.1.0"
  TRACE2D_B2_SATELLITE_SOURCE_COMMIT: 1b7d40537240fd54300f54bf6fda1ea91f06c878
  TRACE2D_B2_NODE_VERSION_PIN: 22.18.0

jobs:
  godot-agent-loop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.TRACE2D_B2_NODE_VERSION_PIN }}

      - name: Verify pinned Node.js
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${TRACE2D_B2_NODE_VERSION_PIN}"

      - name: Download and verify pinned official Godot build
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64.zip"
          checksums="$RUNNER_TEMP/SHA512-SUMS.txt"
          install_dir="$RUNNER_TEMP/godot"
          release_base="https://github.com/godotengine/godot-builds/releases/download/${TRACE2D_B2_GODOT_VERSION}"
          curl --fail --location --retry 3 "$release_base/Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64.zip" --output "$archive"
          curl --fail --location --retry 3 "$release_base/SHA512-SUMS.txt" --output "$checksums"
          (
            cd "$RUNNER_TEMP"
            grep "  Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64.zip$" "$checksums" | sha512sum --check --strict
          )
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64"
          echo "GODOT_PATH=$install_dir/Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Ensure virtual X display is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Install and pin Godot Agent Loop candidate
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/godot-agent-loop"
          fixture="$RUNNER_TEMP/b2-agent-loop-fixture"
          evidence="$RUNNER_TEMP/b2-agent-loop-evidence"
          launcher="$RUNNER_TEMP/godot-agent-loop-npx"
          rm -rf "$prefix" "$fixture" "$evidence" "$launcher"
          mkdir -p "$evidence"
          cp -a benchmarks/b2/qualification/gameplay_loop_fixture "$fixture"
          npm install --prefix "$prefix" --no-audit --no-fund "$TRACE2D_B2_AGENT_LOOP_PACKAGE"
          package_json="$prefix/node_modules/@beremaran/godot-agent-loop/package.json"
          test "$(node -p "require(process.argv[1]).version" "$package_json")" = "3.0.0"
          integrity="$(npm view "$TRACE2D_B2_AGENT_LOOP_PACKAGE" dist.integrity)"
          test -n "$integrity"
          cat > "$launcher" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec npx --yes '@beremaran/godot-agent-loop@3.0.0'
          SH
          chmod +x "$launcher"
          printf '%s\n' "$integrity" > "$evidence/npm-integrity.txt"
          printf '%s\n' "$TRACE2D_B2_AGENT_LOOP_SOURCE_COMMIT" > "$evidence/source-commit.txt"
          echo "TRACE2D_B2_AGENT_LOOP_SERVER=$launcher" >> "$GITHUB_ENV"
          echo "TRACE2D_B2_AGENT_LOOP_FIXTURE=$fixture" >> "$GITHUB_ENV"
          echo "TRACE2D_B2_AGENT_LOOP_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "TRACE2D_B2_AGENT_LOOP_INTEGRITY=$integrity" >> "$GITHUB_ENV"
          echo "TRACE2D_B2_NODE_VERSION=$(node --version)" >> "$GITHUB_ENV"
          echo "GODOT_MCP_ALLOWED_DIRS=$fixture" >> "$GITHUB_ENV"
          echo "GODOT_MCP_LEGACY_JSON_TEXT=false" >> "$GITHUB_ENV"

      - name: Qualify documented Agent Loop quickstart without workarounds
        shell: bash
        run: |
          set -euo pipefail
          output="$TRACE2D_B2_AGENT_LOOP_EVIDENCE/qualifier.stdout.log"
          set +e
          xvfb-run -a python3 scripts/qualify_b2_godot_agent_loop.py \
            --server "$TRACE2D_B2_AGENT_LOOP_SERVER" \
            --project "$TRACE2D_B2_AGENT_LOOP_FIXTURE" \
            --source-fixture benchmarks/b2/qualification/gameplay_loop_fixture \
            --evidence "$TRACE2D_B2_AGENT_LOOP_EVIDENCE/qualification.json" \
            --mcp-stderr "$TRACE2D_B2_AGENT_LOOP_EVIDENCE/mcp.stderr.log" \
            2>&1 | tee "$output"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if ! grep -Fq "MCP server exited with code 0" "$output"; then
            echo "Agent Loop failed for an unclassified harness/runtime reason" >&2
            exit "$status"
          fi
          python3 - "$TRACE2D_B2_AGENT_LOOP_EVIDENCE/qualification.json" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          data = {
              "schema_version": 1,
              "benchmark_id": "trace2d-b2",
              "qualification_id": "b2-gameplay-loop-qualification-v1",
              "scored": False,
              "qualified": False,
              "scored_task_prompt_exposed": False,
              "candidate": {
                  "id": "beremaran/godot-agent-loop",
                  "package": "@beremaran/godot-agent-loop@3.0.0",
                  "version": "3.0.0",
                  "source_commit": os.environ["TRACE2D_B2_AGENT_LOOP_SOURCE_COMMIT"],
                  "npm_integrity": os.environ["TRACE2D_B2_AGENT_LOOP_INTEGRITY"],
              },
              "engine": {"id": "godot", "version": "4.7.1-stable"},
              "failure": {
                  "stage": "mcp_initialize",
                  "classification": "normal_quickstart_bootstrap_failure",
                  "observed": "documented npx entrypoint exited 0 before initialize response",
                  "workaround_used": False,
              },
              "independent_fixture_precheck_passed": True,
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path(sys.argv[1]).write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Validate Agent Loop qualification result
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TRACE2D_B2_AGENT_LOOP_EVIDENCE/qualification.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["benchmark_id"] == "trace2d-b2"
          assert data["qualification_id"] == "b2-gameplay-loop-qualification-v1"
          assert data["scored"] is False
          assert data["scored_task_prompt_exposed"] is False
          assert data["candidate"]["version"] == "3.0.0"
          assert data["candidate"]["source_commit"] == "7bc6062f90e2f96a04f997b202f7a24dd152a9fd"
          if data["qualified"] is False:
              assert data["failure"]["stage"] == "mcp_initialize"
              assert data["failure"]["classification"] == "normal_quickstart_bootstrap_failure"
              assert data["failure"]["workaround_used"] is False
          else:
              assert data["qualified"] is True
              assert all(data["checks"].values())
          PY

      - name: Syntax-check Agent Loop qualification driver
        run: python3 -m py_compile scripts/qualify_b2_godot_agent_loop.py scripts/qualify_godot_agent_mcp.py

      - name: Upload Agent Loop non-scored qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: b2-godot-agent-loop-qualification-${{ github.sha }}
          path: ${{ env.TRACE2D_B2_AGENT_LOOP_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90

  satellite-godot-mcp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.TRACE2D_B2_NODE_VERSION_PIN }}

      - name: Verify pinned Node.js
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${TRACE2D_B2_NODE_VERSION_PIN}"

      - name: Download and verify pinned official Godot build
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64.zip"
          checksums="$RUNNER_TEMP/SHA512-SUMS.txt"
          install_dir="$RUNNER_TEMP/godot"
          release_base="https://github.com/godotengine/godot-builds/releases/download/${TRACE2D_B2_GODOT_VERSION}"
          curl --fail --location --retry 3 "$release_base/Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64.zip" --output "$archive"
          curl --fail --location --retry 3 "$release_base/SHA512-SUMS.txt" --output "$checksums"
          (
            cd "$RUNNER_TEMP"
            grep "  Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64.zip$" "$checksums" | sha512sum --check --strict
          )
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64"
          echo "GODOT_PATH=$install_dir/Godot_v${TRACE2D_B2_GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Ensure virtual X display is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Install exact satellite candidate and addon
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/satellite-godot-mcp"
          fixture="$RUNNER_TEMP/b2-satellite-fixture"
          evidence="$RUNNER_TEMP/b2-satellite-evidence"
          rm -rf "$prefix" "$fixture" "$evidence"
          mkdir -p "$evidence"
          cp -a benchmarks/b2/qualification/gameplay_loop_fixture "$fixture"
          npm install --prefix "$prefix" --no-audit --no-fund "$TRACE2D_B2_SATELLITE_PACKAGE"
          server="$prefix/node_modules/.bin/godot-mcp"
          test -x "$server"
          test "$("$server" --version)" = "4.1.0"
          integrity="$(npm view "$TRACE2D_B2_SATELLITE_PACKAGE" dist.integrity)"
          test -n "$integrity"
          "$server" --install-addon "$fixture"
          printf '%s\n' "$integrity" > "$evidence/npm-integrity.txt"
          printf '%s\n' "$TRACE2D_B2_SATELLITE_SOURCE_COMMIT" > "$evidence/source-commit.txt"
          echo "TRACE2D_B2_SATELLITE_SERVER=$server" >> "$GITHUB_ENV"
          echo "TRACE2D_B2_SATELLITE_FIXTURE=$fixture" >> "$GITHUB_ENV"
          echo "TRACE2D_B2_SATELLITE_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "TRACE2D_B2_SATELLITE_INTEGRITY=$integrity" >> "$GITHUB_ENV"
          echo "TRACE2D_B2_NODE_VERSION=$(node --version)" >> "$GITHUB_ENV"

      - name: Launch Godot editor with satellite addon
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a "$GODOT_PATH" \
            --editor \
            --path "$TRACE2D_B2_SATELLITE_FIXTURE" \
            --rendering-method gl_compatibility \
            >"$TRACE2D_B2_SATELLITE_EVIDENCE/godot-editor.log" 2>&1 &
          editor_pid=$!
          echo "$editor_pid" > "$TRACE2D_B2_SATELLITE_EVIDENCE/editor.pid"
          sleep 3
          if ! kill -0 "$editor_pid" 2>/dev/null; then
            cat "$TRACE2D_B2_SATELLITE_EVIDENCE/godot-editor.log"
            exit 1
          fi

      - name: Prove satellite author-run-observe-input-capture-verify loop
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qualify_b2_godot_mcp_satellite.py \
            --server "$TRACE2D_B2_SATELLITE_SERVER" \
            --project "$TRACE2D_B2_SATELLITE_FIXTURE" \
            --source-fixture benchmarks/b2/qualification/gameplay_loop_fixture \
            --evidence "$TRACE2D_B2_SATELLITE_EVIDENCE/qualification.json" \
            --mcp-stderr "$TRACE2D_B2_SATELLITE_EVIDENCE/mcp.stderr.log"

      - name: Stop qualification editor
        if: always()
        shell: bash
        run: |
          pid_file="$TRACE2D_B2_SATELLITE_EVIDENCE/editor.pid"
          if [[ -f "$pid_file" ]]; then
            editor_pid="$(cat "$pid_file")"
            kill "$editor_pid" 2>/dev/null || true
          fi

      - name: Validate satellite qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TRACE2D_B2_SATELLITE_EVIDENCE/qualification.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["benchmark_id"] == "trace2d-b2"
          assert data["qualification_id"] == "b2-gameplay-loop-qualification-v1"
          assert data["scored"] is False
          assert data["qualified"] is True
          assert data["scored_task_prompt_exposed"] is False
          assert data["candidate"]["id"] == "satelliteoflove/godot-mcp"
          assert data["candidate"]["version"] == "4.1.0"
          assert data["candidate"]["source_commit"] == "1b7d40537240fd54300f54bf6fda1ea91f06c878"
          assert data["engine"]["version"] == "4.7.1-stable"
          assert all(data["checks"].values())
          assert data["fixture"]["source_tree_sha256_before"] == data["fixture"]["source_tree_sha256_after"]
          assert data["independent_verifier"]["known_good"]["accepted"] is True
          assert data["independent_verifier"]["known_bad"]["accepted"] is False
          PY

      - name: Syntax-check satellite qualification driver
        run: python3 -m py_compile scripts/qualify_b2_godot_mcp_satellite.py scripts/qualify_godot_agent_mcp.py scripts/qualify_godot_agent_mcp_live.py

      - name: Upload satellite non-scored qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: b2-satellite-godot-mcp-qualification-${{ github.sha }}
          path: ${{ env.TRACE2D_B2_SATELLITE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
