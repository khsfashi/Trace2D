name: Benchmark B1 Owner Scored Cohort

on:
  pull_request:
    branches:
      - main
    types:
      - labeled

permissions:
  actions: read
  contents: read

concurrency:
  group: trace2d-owner-b1-scored
  cancel-in-progress: false

jobs:
  approval-gate:
    if: >-
      github.repository == 'khsfashi/Trace2D' &&
      github.event.pull_request.number == 174 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/benchmark-b1-content-authoring' &&
      github.event.label.name == 'github_actions' &&
      github.actor == 'khsfashi' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful owner preflight on this exact head
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request.head.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              head_sha: headSha,
              per_page: 100,
            });
            const passed = runs.find((run) =>
              run.name === 'Benchmark B1 Owner Preflight' &&
              run.head_sha === headSha &&
              run.conclusion === 'success'
            );
            if (!passed) {
              core.setFailed(`No successful Benchmark B1 Owner Preflight exists for head ${headSha}.`);
              return;
            }
            core.info(`Approved head ${headSha} after preflight run ${passed.id}.`);

  owner-windows-scored:
    needs: approval-gate
    runs-on: [self-hosted, windows, x64, trace2d-gpu]
    timeout-minutes: 720

    steps:
      - name: Purge persistent self-hosted workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Checkout exact approved B1 head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Restore canonical frozen benchmark bytes
        shell: pwsh
        run: |
          python scripts/materialize_benchmark_b1_frozen_bytes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/benchmark_b1.py validate-suite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run exact 27-slot scored cohort
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runsRoot = Join-Path $env:RUNNER_TEMP "trace2d-b1-scored-$env:GITHUB_RUN_ID"
          if (Test-Path $runsRoot) {
            Remove-Item -LiteralPath $runsRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $runsRoot | Out-Null
          & python scripts/run_benchmark_b1_codex_windows_acl_scored_cohort.py --runs-root $runsRoot
          $exitCode = $LASTEXITCODE
          New-Item -ItemType Directory -Force -Path 'artifacts\b1-scored' | Out-Null
          Get-ChildItem -LiteralPath $runsRoot -Filter 'codex-chatgpt-b1-scored-*.zip' -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path 'artifacts\b1-scored' $_.Name) -Force
          }
          exit $exitCode

      - name: Upload scored B1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-b1-scored-${{ github.event.pull_request.head.sha }}
          path: artifacts/b1-scored/*.zip
          if-no-files-found: warn
          retention-days: 90
