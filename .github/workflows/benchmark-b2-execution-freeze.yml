name: Benchmark B2 Scored Execution Freeze

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "benchmarks/b2/execution-v1.json"
      - "benchmarks/b2/EXECUTION.md"
      - "benchmarks/b2/starters/**"
      - "docs/AGENT_PUBLIC_API.md"
      - "docs/agent-public-api-v1.json"
      - "scripts/benchmark_b2_execution_freeze.py"
      - "scripts/test_benchmark_b2_execution_freeze.py"
      - "scripts/benchmark_b2_codex_windows_acl_wrapper.py"
      - "scripts/benchmark_b2_postscore_remediation.py"
      - "scripts/benchmark_b2_postscore_report.py"
      - "scripts/test_benchmark_b2_postscore_remediation.py"
      - ".github/workflows/benchmark-b2-execution-freeze.yml"
  pull_request:
    branches:
      - main
    paths:
      - "benchmarks/b2/execution-v1.json"
      - "benchmarks/b2/EXECUTION.md"
      - "benchmarks/b2/starters/**"
      - "docs/AGENT_PUBLIC_API.md"
      - "docs/agent-public-api-v1.json"
      - "scripts/benchmark_b2_execution_freeze.py"
      - "scripts/test_benchmark_b2_execution_freeze.py"
      - "scripts/benchmark_b2_codex_windows_acl_wrapper.py"
      - "scripts/benchmark_b2_postscore_remediation.py"
      - "scripts/benchmark_b2_postscore_report.py"
      - "scripts/test_benchmark_b2_postscore_remediation.py"
      - ".github/workflows/benchmark-b2-execution-freeze.yml"

permissions:
  contents: read

jobs:
  execution-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history for B1 integrity anchor
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Revalidate frozen B2 scoring gate
        run: python3 -m scripts.benchmark_b2_p1_freeze

      - name: Validate pre-score execution inputs
        run: python3 -m scripts.benchmark_b2_execution_freeze

      - name: Run execution-freeze regression tests
        run: python3 -m unittest scripts.test_benchmark_b2_execution_freeze

      - name: Run post-score remediation regression tests
        run: python3 -m unittest scripts.test_benchmark_b2_postscore_remediation

      - name: Syntax-check B2 tooling
        run: |
          python3 -m py_compile \
            scripts/benchmark_b2_execution_freeze.py \
            scripts/test_benchmark_b2_execution_freeze.py \
            scripts/benchmark_b2_codex_windows_acl_wrapper.py \
            scripts/benchmark_b2_postscore_remediation.py \
            scripts/benchmark_b2_postscore_report.py \
            scripts/test_benchmark_b2_postscore_remediation.py
