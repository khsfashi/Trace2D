name: Nightfall layout fix once

on:
  push:
    branches:
      - game/nightfall-survivors
    paths:
      - ".nightfall-layout-fix-trigger"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: game/nightfall-survivors
          fetch-depth: 0

      - name: Apply exact measured-layout replacements
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("examples/g1_nightfall_survivors/NightfallPresentationMeasured.cpp"): [
                  (
                      "heroes_[characterIndex], {-0.28F, -0.82F + bob}, {2.65F, 2.65F}",
                      "heroes_[characterIndex], {-0.28F, -1.18F + bob}, {2.65F, 2.65F}",
                  ),
              ],
              Path("examples/g1_nightfall_survivors/NightfallLayoutContractMain.cpp"): [
                  (
                      "const Rect hero = Sprite(heroes_[characterIndex], -0.28F, -0.82F, 2.65F, 2.65F);",
                      "const Rect hero = Sprite(heroes_[characterIndex], -0.28F, -1.14F, 2.65F, 2.65F);",
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exactly one match for {old!r}, got {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/g1_nightfall_survivors/NightfallPresentationMeasured.cpp examples/g1_nightfall_survivors/NightfallLayoutContractMain.cpp
          git diff --cached --check
          git commit -m "fix: separate Nightfall hero preview from copy"
          git push origin HEAD:game/nightfall-survivors
