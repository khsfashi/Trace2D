name: Benchmark B2 Owner Scored Runner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Prepare only, or execute exactly the next frozen B2 slot"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - run-next
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: trace2d-owner-b2-scored
  cancel-in-progress: false

jobs:
  owner-windows:
    if: >-
      github.repository == 'khsfashi/Trace2D' &&
      github.actor == 'khsfashi' &&
      github.run_attempt == 1 &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'issue_comment' &&
          github.ref == 'refs/heads/main' &&
          (
            (github.event.issue.number == 271 && github.event.comment.body == '/b2 preflight') ||
            (github.event.issue.number == 272 && github.event.comment.body == '/b2 run-next')
          )
        )
      )
    runs-on: [self-hosted, windows, x64, trace2d-gpu]
    timeout-minutes: 180

    steps:
      - name: Purge persistent self-hosted workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Checkout exact main head for this owner trigger
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve owner-requested mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $mode = '${{ inputs.mode }}'
          } elseif ('${{ github.event.issue.number }}' -eq '271') {
            $mode = 'preflight'
          } elseif ('${{ github.event.issue.number }}' -eq '272') {
            $mode = 'run-next'
          } else {
            throw 'Unrecognized B2 owner control trigger.'
          }

          if ($mode -notin @('preflight', 'run-next')) {
            throw "Invalid B2 mode: $mode"
          }
          "TRACE2D_B2_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bind proven runner Python 3.12 cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TOOL_CACHE)) {
            throw 'RUNNER_TOOL_CACHE is required on the owner runner.'
          }
          $pythonRoot = Join-Path $env:RUNNER_TOOL_CACHE 'Python'
          $candidates = @(Get-ChildItem -LiteralPath $pythonRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^3\.12\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\python.exe' } |
            Where-Object { Test-Path $_ -PathType Leaf })
          if ($candidates.Count -eq 0) {
            throw "No cached Python 3.12 x64 interpreter found under $pythonRoot. B1 owner preflight previously qualified this cache."
          }

          $python = $null
          $version = $null
          foreach ($candidate in $candidates) {
            $probe = (& $candidate -I -c "import sys,json,pathlib,hashlib,subprocess,tempfile,venv; print('.'.join(str(v) for v in sys.version_info[:3]))" 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -eq 0 -and $probe -match '^3\.12\.\d+$') {
              $python = [System.IO.Path]::GetFullPath($candidate)
              $version = $probe
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($python)) {
            throw "No healthy cached Python 3.12 interpreter found. Candidates: $($candidates -join ', ')"
          }

          $pythonDir = Split-Path -Parent $python
          $pythonScripts = Join-Path $pythonDir 'Scripts'
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path $pythonScripts -PathType Container) {
            $pythonScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          "TRACE2D_B2_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "B2 Python: $python ($version)"

      - name: Set up Node.js 24 for isolated Codex install
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Discover exact next frozen slot
        id: next
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $runsRoot = Join-Path $env:LOCALAPPDATA 'Trace2D\benchmark-b2-scored-v1'
          New-Item -ItemType Directory -Force -Path $runsRoot | Out-Null

          $json = (& $env:TRACE2D_B2_PYTHON scripts/benchmark_b2_scored_harness.py next-slot --runs-root $runsRoot | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "B2 next-slot failed with exit code $LASTEXITCODE." }
          $data = $json | ConvertFrom-Json
          if ($null -eq $data.next_slot) {
            throw 'All nine frozen B2 initial slots are already recorded.'
          }

          $slot = [int]$data.next_slot.slot
          $lane = [string]$data.next_slot.lane
          if ($slot -lt 1 -or $slot -gt 9) { throw "Invalid frozen B2 slot: $slot" }
          if ($lane -notin @('godot.generic', 'godot.agent', 'trace2d.agent')) { throw "Invalid frozen B2 lane: $lane" }

          "TRACE2D_B2_RUNS_ROOT=$runsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACE2D_B2_SLOT=$slot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACE2D_B2_LANE=$lane" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "slot=$slot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "lane=$lane" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "## B2 next frozen slot" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- slot: ``$slot``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- lane: ``$lane``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- mode: ``$env:TRACE2D_B2_MODE``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- trigger: ``$env:GITHUB_EVENT_NAME``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Prepare exact lane toolchain without touching global Codex
        shell: pwsh
        run: |
          $pythonDir = Split-Path -Parent $env:TRACE2D_B2_PYTHON
          $env:PATH = "$pythonDir;$(Join-Path $pythonDir 'Scripts');$env:PATH"
          . .\scripts\prepare_benchmark_b2_owner_windows.ps1 -Lane $env:TRACE2D_B2_LANE -PersistForActions

      - name: Run zero-score environment preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonDir = Split-Path -Parent $env:TRACE2D_B2_PYTHON
          $env:PATH = "$pythonDir;$(Join-Path $pythonDir 'Scripts');$env:PATH"
          . .\scripts\prepare_benchmark_b2_owner_windows.ps1 -Lane $env:TRACE2D_B2_LANE
          & $env:TRACE2D_B2_PYTHON scripts/benchmark_b2_scored_harness.py preflight-slot --runs-root $env:TRACE2D_B2_RUNS_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute exactly the next frozen scored slot
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'run-next') ||
          (github.event_name == 'issue_comment' && github.event.issue.number == 272)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TRACE2D_B2_MODE -ne 'run-next') { throw "Unexpected scored mode: $env:TRACE2D_B2_MODE" }
          # Reapply in this exact process so Codex inherits the sandbox-safe shell PATH.
          $pythonDir = Split-Path -Parent $env:TRACE2D_B2_PYTHON
          $env:PATH = "$pythonDir;$(Join-Path $pythonDir 'Scripts');$env:PATH"
          . .\scripts\prepare_benchmark_b2_owner_windows.ps1 -Lane $env:TRACE2D_B2_LANE
          $slot = [int]$env:TRACE2D_B2_SLOT
          & $env:TRACE2D_B2_PYTHON scripts/benchmark_b2_scored_harness.py run-slot --runs-root $env:TRACE2D_B2_RUNS_ROOT --slot $slot
          exit $LASTEXITCODE

      - name: Report retained schedule state
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TRACE2D_B2_RUNS_ROOT) -or [string]::IsNullOrWhiteSpace($env:TRACE2D_B2_PYTHON)) { exit 0 }
          "## Retained B2 schedule state" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          & $env:TRACE2D_B2_PYTHON scripts/benchmark_b2_scored_harness.py next-slot --runs-root $env:TRACE2D_B2_RUNS_ROOT |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
