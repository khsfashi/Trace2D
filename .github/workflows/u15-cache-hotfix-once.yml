name: U15 cache hotfix one-shot

on:
  push:
    branches:
      - agent/u15-cache-rebuild-hotfix
    paths:
      - .github/workflows/u15-cache-hotfix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v6
        with:
          ref: agent/u15-cache-rebuild-hotfix
          fetch-depth: 0

      - name: Invalidate cache before destructive full rebuild
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("engine/ui/src/UiPresentation2D.cpp")
          source = source_path.read_text(encoding="utf-8")
          needle = "\n".join([
              "    impl_->presentations.clear();",
              "    impl_->elementStates.clear();",
              "    impl_->elementStates.resize(elements.size());",
          ]) + "\n"
          replacement = "\n".join([
              "    // A full rebuild mutates retained storage in place. Invalidate the previous cache identity",
              "    // before the first destructive write so any later diagnostic cannot leave an empty/partial frame",
              "    // reachable through the old signature on a subsequent update.",
              "    impl_->boundDocument = nullptr;",
              "    impl_->boundResources = nullptr;",
              "    impl_->signature = 0U;",
              "    impl_->progressPatchSignature = 0U;",
              "    impl_->hasSignature = false;",
              "",
              "    impl_->presentations.clear();",
              "    impl_->elementStates.clear();",
              "    impl_->elementStates.resize(elements.size());",
          ]) + "\n"

          count = source.count(needle)
          if count != 1:
              raise SystemExit(f"expected exactly one destructive rebuild anchor, found {count}")
          source_path.write_text(source.replace(needle, replacement, 1), encoding="utf-8", newline="\n")
          Path(".github/workflows/u15-cache-hotfix-once.yml").unlink()

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ui/src/UiPresentation2D.cpp .github/workflows/u15-cache-hotfix-once.yml
          git diff --cached --check
          git commit -m "fix(ui): invalidate failed presentation rebuild cache"
          git push origin HEAD:agent/u15-cache-rebuild-hotfix
