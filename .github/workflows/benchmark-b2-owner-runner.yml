name: Benchmark B2 Owner Runner Contract

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - ".gitattributes"
      - "benchmarks/b2/OWNER_RUNNER.md"
      - "scripts/benchmark_b0_stable_harness.py"
      - "scripts/test_benchmark_b0_stable_harness.py"
      - "scripts/benchmark_b2_scored_harness.py"
      - "scripts/test_benchmark_b2_scored_harness.py"
      - "scripts/benchmark_b2_codex_windows_acl_wrapper.py"
      - "scripts/prepare_benchmark_b2_owner_windows.ps1"
      - "scripts/verify_benchmark_b2_candidate.py"
      - "tests/benchmark/CMakeLists.txt"
      - ".github/workflows/benchmark-b2-owner-runner.yml"
      - ".github/workflows/benchmark-b2-owner-scored.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".gitattributes"
      - "benchmarks/b2/OWNER_RUNNER.md"
      - "scripts/benchmark_b0_stable_harness.py"
      - "scripts/test_benchmark_b0_stable_harness.py"
      - "scripts/benchmark_b2_scored_harness.py"
      - "scripts/test_benchmark_b2_scored_harness.py"
      - "scripts/benchmark_b2_codex_windows_acl_wrapper.py"
      - "scripts/prepare_benchmark_b2_owner_windows.ps1"
      - "scripts/verify_benchmark_b2_candidate.py"
      - "tests/benchmark/CMakeLists.txt"
      - ".github/workflows/benchmark-b2-owner-runner.yml"
      - ".github/workflows/benchmark-b2-owner-scored.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile owner-runner Python
        run: |
          python -m py_compile \
            scripts/benchmark_b0_stable_harness.py \
            scripts/test_benchmark_b0_stable_harness.py \
            scripts/benchmark_b2_scored_harness.py \
            scripts/test_benchmark_b2_scored_harness.py \
            scripts/benchmark_b2_codex_windows_acl_wrapper.py \
            scripts/verify_benchmark_b2_candidate.py
          python scripts/verify_benchmark_b2_candidate.py --help >/dev/null

      - name: Run owner-runner recovery regression tests
        run: |
          python scripts/test_benchmark_b0_stable_harness.py
          python scripts/test_benchmark_b2_scored_harness.py

      - name: Validate frozen B2 execution contract
        run: python scripts/benchmark_b2_scored_harness.py validate

      - name: Confirm self-hosted workflow safety and frozen tool pins
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/benchmark-b2-owner-scored.yml').read_text(encoding='utf-8')
          bootstrap = Path('scripts/prepare_benchmark_b2_owner_windows.ps1').read_text(encoding='utf-8')

          for required in (
              'workflow_dispatch:',
              'issue_comment:',
              "github.repository == 'khsfashi/Trace2D'",
              "github.actor == 'khsfashi'",
              "github.ref == 'refs/heads/main'",
              'github.run_attempt == 1',
              'github.event.issue.number == 271',
              "github.event.comment.body == '/b2 preflight'",
              'github.event.issue.number == 272',
              "github.event.comment.body == '/b2 run-next'",
              'runs-on: [self-hosted, windows, x64, trace2d-gpu]',
              'cancel-in-progress: false',
              'TRACE2D_B2_MODE',
              'TRACE2D_B2_PYTHON',
              "Join-Path $env:RUNNER_TOOL_CACHE 'Python'",
              "^3\\.12\\.\\d+$",
              "import sys,json,pathlib,hashlib,subprocess,tempfile,venv",
              'run-next',
              'benchmark_b2_scored_harness.py run-slot',
              '$slot = [int]$env:TRACE2D_B2_SLOT',
              '--slot $slot',
          ):
              assert required in workflow, required
          assert 'actions/setup-python@' not in workflow
          assert '& py -3.13' not in workflow
          assert '--slot ([int]$env:TRACE2D_B2_SLOT)' not in workflow

          for required in (
              "$codexVersion = '0.144.6'",
              "$godotRelease = '4.7.1-stable'",
              "$godotIdentity = '4.7.1.stable.official.a13da4feb'",
              "$godotAiVersion = '3.1.5'",
              "$godotAiCommit = '09a1e3311015153d967710fbe6502ac519585a9b'",
              "$godotAiPackageSha256 = '51863ba177c66299808aa19ef6cd9069768915b2434d7787b9300e40c3620b04'",
              'SHA512-SUMS.txt',
              'TRACE2D_BENCH_CODEX_BIN',
              'TRACE2D_B2_GODOT_BIN',
              'TRACE2D_B2_GODOT_AI_PYTHON',
              'TRACE2D_BENCH_TRACE2D_BIN',
              '& $venvPython -m pip install --disable-pip-version-check --force-reinstall $package.FullName',
              '& $Command | Out-Host',
              '$exitCode = $LASTEXITCODE',
              'throw "$Label failed with exit code $exitCode."',
          ):
              assert required in bootstrap, required
          assert '--no-deps --force-reinstall' not in bootstrap
          PY

      - name: Confirm pristine next slot is slot 1
        shell: bash
        run: |
          runs_root="$RUNNER_TEMP/b2-owner-runner-contract"
          python scripts/benchmark_b2_scored_harness.py next-slot --runs-root "$runs_root" > "$RUNNER_TEMP/next-slot.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "next-slot.json").read_text(encoding="utf-8"))
          slot = data.get("next_slot", {})
          assert slot.get("slot") == 1, data
          assert slot.get("repetition") == 1, data
          assert slot.get("task") == "b2-topdown-combat-v1", data
          assert slot.get("lane") == "godot.generic", data
          PY

      - name: Confirm slot skipping is rejected without running an Agent
        shell: bash
        run: |
          runs_root="$RUNNER_TEMP/b2-owner-runner-contract"
          set +e
          python scripts/benchmark_b2_scored_harness.py run-slot --runs-root "$runs_root" --slot 2 > "$RUNNER_TEMP/skip.stdout" 2> "$RUNNER_TEMP/skip.stderr"
          code=$?
          set -e
          test "$code" -eq 2
          grep -F "next frozen B2 slot is 1 (godot.generic), not requested slot 2" "$RUNNER_TEMP/skip.stderr"

  windows-checkout:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse B2 owner bootstrap PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $content = Get-Content -LiteralPath scripts\prepare_benchmark_b2_owner_windows.ps1 -Raw
          [void][scriptblock]::Create($content)

      - name: Verify checked native output stays out of return streams
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $content = Get-Content -LiteralPath scripts\prepare_benchmark_b2_owner_windows.ps1 -Raw
          $ast = [scriptblock]::Create($content).Ast
          $function = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq 'Invoke-B2Checked'
          }, $true)
          if ($null -eq $function) {
              throw 'Invoke-B2Checked function was not found.'
          }
          Invoke-Expression $function.Extent.Text

          $captured = @(Invoke-B2Checked -Label 'stdout regression' -Command {
              cmd.exe /d /c 'echo noisy-success-output'
          })
          if ($captured.Count -ne 0) {
              throw "Invoke-B2Checked leaked $($captured.Count) success-stream object(s)."
          }

      - name: Re-clone with Windows autocrlf enabled
        shell: pwsh
        run: |
          $clone = Join-Path $env:RUNNER_TEMP "b2-windows-autocrlf-clone"
          git -c core.autocrlf=true clone . $clone
          Set-Location $clone
          python scripts/benchmark_b2_scored_harness.py validate
          python scripts/test_benchmark_b0_stable_harness.py
          python scripts/test_benchmark_b2_scored_harness.py