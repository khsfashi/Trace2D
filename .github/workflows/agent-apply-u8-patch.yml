name: Agent Apply U8 Patch

on:
  push:
    branches:
      - agent/e6-u8-ui-clipping
    paths:
      - .agent/u8.patch
      - .github/workflows/agent-apply-u8-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply U8 patch
        shell: bash
        run: |
          git apply --check --recount .agent/u8.patch
          git apply --recount .agent/u8.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ui engine/agent tests/ui docs/UI_E6_U8.md
          git commit -m "E6 U8: add deterministic hierarchical clipping"
          git push origin "HEAD:${GITHUB_REF_NAME}"
