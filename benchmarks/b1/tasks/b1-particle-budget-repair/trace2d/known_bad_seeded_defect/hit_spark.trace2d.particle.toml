format_version = 1

[effect]
id = "hit_spark"
backend = "cpu"
max_particles = 64
duration_frames = 24
loop = false
play_on_load = false
simulation_space = "world"

[emission]
start_frame = 0
count = 8
every_frames = 4

[spawn]
shape = "point"
offset = [0.0, 0.0]
box_half_extents = [0.0, 0.0]
circle_radius = 0.0

[lifetime]
frames = [2, 24]

[motion]
speed = [0.5, 3.0]
angle_radians = [-3.0, 3.0]
acceleration = [0.0, -0.1]

[scale]
initial = [0.5, 1.5]
end_multiplier = 0.25

[rotation]
initial_radians = [-1.0, 1.0]
angular_velocity_radians_per_frame = [-0.2, 0.2]

[color]
initial_min = [0.5, 0.5, 0.5, 1.0]
initial_max = [1.0, 1.0, 1.0, 1.0]
end = [1.0, 0.5, 0.1, 0.0]

[presentation]
blend = "additive"
sprites = ["textures/particles/spark.png"]
