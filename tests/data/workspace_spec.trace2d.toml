format_version = 1

[work]
id = "workspace-feedback-loop"
intent = "Review a verified hit effect, request a heavier feel, and review the revised verified result."
state = "implemented"
constraints = [
  "Gameplay damage must remain unchanged by subjective presentation feedback.",
  "Human approval is never inferred from deterministic verification."
]

[[deliverables]]
id = "hit-effect"
description = "A deterministic hit effect with a human-reviewed presentation."
state = "implemented"

[[acceptance]]
id = "semantic-proof"
deliverable = "hit-effect"
description = "Gameplay semantics remain deterministic across the requested presentation revision."
verification = "deterministic"
state = "implemented"

[[acceptance]]
id = "feel-review"
deliverable = "hit-effect"
description = "A human reviews the hit effect feel and explicitly approves or requests another revision."
verification = "human"
state = "review_needed"

[[external_truth]]
id = "human-approval"
kind = "human_approval"
description = "Final feel approval is live human state and is not cached as repository truth by the Workspace."
