format_version = 1

[effect]
id = "cli_authoring_spark"
backend = "cpu"
max_particles = 32
duration_frames = 12
loop = false
play_on_load = true
simulation_space = "local"

[emission]
start_frame = 0
count = 2
every_frames = 3

[spawn]
shape = "point"
offset = [0.0, 0.0]
box_half_extents = [0.0, 0.0]
circle_radius = 0.0

[lifetime]
frames = [2, 6]

[motion]
speed = [0.0, 1.0]
angle_radians = [0.0, 0.0]
acceleration = [0.0, 0.0]

[scale]
initial = [1.0, 1.0]
end_multiplier = 1.0

[rotation]
initial_radians = [0.0, 0.0]
angular_velocity_radians_per_frame = [0.0, 0.0]

[color]
initial_min = [1.0, 1.0, 1.0, 1.0]
initial_max = [1.0, 1.0, 1.0, 1.0]
end = [1.0, 1.0, 1.0, 0.0]

[presentation]
blend = "alpha"
sprites = ["sprites/cli_spark.sprite.toml"]
