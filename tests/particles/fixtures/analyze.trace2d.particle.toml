format_version = 1

[effect]
id = "analysis_fixture"
backend = "cpu"
max_particles = 16
duration_frames = 4
loop = false
play_on_load = true
simulation_space = "local"

[emission]
start_frame = 0
count = 1
every_frames = 1

[spawn]
shape = "point"
offset = [0.0, 0.0]
box_half_extents = [0.0, 0.0]
circle_radius = 0.0

[lifetime]
frames = [4, 4]

[motion]
speed = [0.0, 0.0]
angle_radians = [0.0, 0.0]
acceleration = [0.0, 0.0]

[scale]
initial = [1.0, 1.0]
end_multiplier = 1.0

[rotation]
initial_radians = [0.0, 0.0]
angular_velocity_radians_per_frame = [0.0, 0.0]

[color]
initial_min = [1.0, 1.0, 1.0, 1.0]
initial_max = [1.0, 1.0, 1.0, 1.0]
end = [1.0, 1.0, 1.0, 1.0]

[presentation]
blend = "alpha"
sprites = ["textures/particles/fixture.png"]
