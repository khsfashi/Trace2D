format_version = 1

[effect]
id = "workload_gpu_scale"
backend = "gpu"
max_particles = 4096
duration_frames = 240
loop = false
play_on_load = true
simulation_space = "local"

[emission]
start_frame = 0
count = 64
every_frames = 1

[spawn]
shape = "circle"
offset = [0.0, 0.0]
box_half_extents = [0.0, 0.0]
circle_radius = 1.0

[lifetime]
frames = [45, 60]

[motion]
speed = [0.05, 0.25]
angle_radians = [-3.1415927, 3.1415927]
acceleration = [0.0, -0.0015]

[scale]
initial = [0.2, 0.55]
end_multiplier = 0.2

[rotation]
initial_radians = [-3.1415927, 3.1415927]
angular_velocity_radians_per_frame = [-0.04, 0.04]

[color]
initial_min = [0.5, 0.65, 0.85, 0.5]
initial_max = [1.0, 1.0, 1.0, 1.0]
end = [0.1, 0.25, 0.7, 0.0]

[presentation]
blend = "additive"
sprites = ["textures/particles/workload.png"]